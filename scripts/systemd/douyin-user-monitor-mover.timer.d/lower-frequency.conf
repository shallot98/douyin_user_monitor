[Unit]
# 原为每分钟触发。单轮耗时 20–40 秒（网盘超时时最坏 216–360 秒），
# 而搬运判据是 MIN_AGE_SECONDS=120，并不需要高频跑；降到 10 分钟
# 可省掉约 90% 对夸克/和动力云的强制远端列目录请求。
Description=Run Douyin User Monitor OpenList mover every 10 minutes (was every minute)

[Timer]
# 必须先清空，否则 systemd 会把新旧 OnCalendar 当成两个触发点叠加
OnCalendar=
OnCalendar=*-*-* *:00/10:00
