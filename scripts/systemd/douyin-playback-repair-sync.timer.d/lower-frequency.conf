[Unit]
# 该 timer 每 5 分钟去读一次上游 worker 状态并发布回执，但 worker
# douyin-playback-repair 自 2026-09-19 12:26 EXITED(exit_code=3) 后
# received_this_poll 恒为 0 —— 属于确认式空转，且每轮会构造 OpenListClient
# 触发目录刷新（sync_results.py:101,117,123）。降到每小时。
Description=Synchronize verified playback repair receipts every hour (was every 5min)

[Timer]
# 必须清空原值，systemd 的 timer 触发项是累加而非覆盖
OnUnitInactiveSec=
OnUnitInactiveSec=1h
