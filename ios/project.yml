# XcodeGen 工程定义：CI 里 xcodegen generate 出 DyMon.xcodeproj，仓库不落 Xcode 工程文件。
name: DyMon
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  DyMon:
    type: application
    platform: iOS
    sources:
      - path: DyMon
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cenai.dymon
        PRODUCT_NAME: DyMon
        INFOPLIST_FILE: DyMon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  DyMon:
    build:
      targets:
        DyMon: all
    run:
      config: Release
    archive:
      config: Release
