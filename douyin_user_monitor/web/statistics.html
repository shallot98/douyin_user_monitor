<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>用户统计中心 | Monitor</title>
  <link rel="stylesheet" href="/static/common.css?v=theme-20260921b" />
  <style>
    /* statistics page-only styles; shell/sidebar/tabbar come from common.css */

    /* 头像 → 作品列表入口 */
    .user-avatar-link {
      display: block;
      flex-shrink: 0;
      border-radius: 14px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .user-avatar-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.28);
    }

    /* 作品浮层：盖在本页之上，不做页面跳转，返回时表格状态与滚动位置原样保留 */
    .works-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
    }
    .works-overlay.show { display: flex; }
    .works-overlay-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1180px;
      height: 92vh;
      overflow: hidden;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
    }
    .works-overlay-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .works-overlay-title { font-size: 14px; font-weight: 700; }
    .works-overlay-frame { flex: 1; min-height: 0; width: 100%; border: 0; }
    @media (max-width: 1024px) {
      .works-overlay { padding: 0; }
      .works-overlay-panel { height: 100%; border-radius: 0; }
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border-color);
      border-radius: calc(var(--radius-lg) + 4px);
      padding: 12px 8px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }
    body.theme-dark .summary-bar {
      background: #172033;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .summary-item {
      position: relative;
      padding: 8px 14px;
      min-width: 0;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.15s ease;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .summary-item:hover { background: var(--bg-elevated); }
    .summary-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .summary-item + .summary-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 1px;
      background: var(--border-color);
      opacity: 0.55;
    }
    .summary-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .summary-value {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -0.5px;
      color: var(--text-main);
      line-height: 1.15;
    }
    .summary-help {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-lighter);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .stats-toolbar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      flex-wrap: wrap;
    }
    .stats-search-wrap {
      position: relative;
      flex: 1 1 260px;
      min-width: min(100%, 220px);
      max-width: 420px;
    }
    .stats-search-wrap .input-search {
      width: 100%;
      min-width: 0;
      padding-left: 40px;
    }
    .stats-search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-lighter);
      pointer-events: none;
      display: inline-flex;
    }
    .stats-search-icon svg { width: 16px; height: 16px; }
    .stats-toolbar-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      margin-left: auto;
      min-width: 0;
    }
    .toolbar-hint {
      font-size: 12px;
      font-weight: 650;
      color: var(--text-main);
      white-space: nowrap;
    }
    .toolbar-generated {
      font-size: 12px;
      color: var(--text-lighter);
      white-space: nowrap;
    }
    .filter-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-chip {
      border: 1px solid var(--border-color);
      background: var(--bg-elevated);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .filter-chip:hover { border-color: var(--border-strong); color: var(--text-main); }
    .filter-chip.active {
      background: var(--primary-light);
      border-color: var(--border-strong);
      color: var(--primary);
    }
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .toolbar-controls select {
      border: 1px solid var(--border-color);
      background: var(--bg-elevated);
      color: var(--text-main);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 650;
      min-height: 34px;
    }

    .stack-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .card-header { background: var(--bg-elevated); }
    .card-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .table-list { display: flex; flex-direction: column; }
    .rank-row {
      display: flex;
      align-items: center;
      gap: 10px 12px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      min-width: 0;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      background: var(--primary-light);
      color: var(--primary);
      flex-shrink: 0;
    }
    .rank-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
    }
    .user-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .user-identity .user-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .user-identity .user-name-text {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-identity .user-meta,
    .rank-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .rank-metrics {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .rank-metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      line-height: 1.15;
    }
    .rank-metric strong {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }
    .rank-metric span,
    .rank-metric-note {
      font-size: 11px;
      color: var(--text-muted);
    }
    .rank-metric-note {
      text-align: right;
      max-width: 150px;
      white-space: normal;
    }
    .row-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .rank-row .pill {
      padding: 3px 8px;
      font-size: 11px;
    }
    .row-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill.warning { background: var(--warn-light); color: #b45309; }
    .pill.danger { background: var(--danger-light); color: #b91c1c; }
    .pill.primary { background: var(--primary-light); color: var(--primary); }
    .pill.success { background: var(--success-light); color: #047857; }
    .pill.secondary { background: var(--border-color); color: #475569; }

    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-elevated);
    }
    .pagination-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pagination-controls .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .page-indicator {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 64px;
      text-align: center;
    }

    .soft-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      border: 1px solid var(--border-strong);
      font-size: 12px;
      font-weight: 650;
      color: var(--accent);
    }
    .soft-badge strong { color: var(--text-main); font-weight: 750; }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      border: 1px dashed var(--border-color);
      border-radius: 14px;
      background: var(--bg-elevated);
      margin: 12px;
    }

    @media (max-width: 1180px) {
      .summary-bar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .summary-item:nth-child(4)::before { display: none; }
      .rank-metrics { gap: 10px; }
      .rank-metric-note { max-width: 120px; }
    }
    @media (max-width: 720px) {
      .summary-bar { grid-template-columns: 1fr 1fr; }
      .summary-item + .summary-item::before { display: none; }
      .summary-item { padding: 10px 8px; }
      .table-list {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .table-list::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .rank-row {
        min-width: 920px;
        align-items: center;
        flex-wrap: nowrap;
        flex-direction: row;
      }
      .rank-main {
        flex: 1 1 auto;
        min-width: 0;
        flex-wrap: nowrap;
        align-items: center;
      }
      .rank-metrics {
        width: auto;
        justify-content: flex-end;
        padding-left: 0;
        flex-shrink: 0;
      }
      .rank-metric { align-items: flex-end; }
      .rank-row .row-actions {
        width: auto;
        justify-content: flex-end;
        padding-left: 0;
        flex-wrap: nowrap;
        flex-shrink: 0;
      }
      .stats-search-wrap { flex: 1 1 100%; max-width: none; }
      .stats-toolbar-meta { width: 100%; align-items: flex-start; margin-left: 0; }
      .toolbar-hint, .toolbar-generated { white-space: normal; }
    }
  </style>
</head>

        <section class="summary-bar" aria-label="统计摘要">
          <button type="button" class="summary-item" onclick="onSummaryClick('users')" title="查看全部监控用户">
            <div class="summary-label">监控用户</div>
            <div class="summary-value" id="summaryUsers">-</div>
            <div class="summary-help" id="summaryUsersHelp">启/停统计</div>
          </button>
          <div class="summary-item" style="cursor:default;" aria-hidden="false">
            <div class="summary-label">下载作品</div>
            <div class="summary-value" id="summaryWorks">-</div>
            <div class="summary-help" id="summaryWorksHelp">人均与结构</div>
          </div>
          <div class="summary-item" style="cursor:default;">
            <div class="summary-label">结构覆盖率</div>
            <div class="summary-value" id="summaryCoverage">-</div>
            <div class="summary-help" id="summaryCoverageHelp">已归档作品</div>
          </div>
          <button type="button" class="summary-item" onclick="onSummaryClick('silent')" title="筛选沉默 7 天用户">
            <div class="summary-label">沉默 7d / 30d</div>
            <div class="summary-value" id="summarySilent">-</div>
            <div class="summary-help" id="summarySilentHelp">无发布时间</div>
          </button>
          <button type="button" class="summary-item" onclick="onSummaryClick('abnormal')" title="筛选异常账号">
            <div class="summary-label">异常账号</div>
            <div class="summary-value" id="summaryAbnormal">-</div>
            <div class="summary-help" id="summaryAbnormalHelp">注销 / 封禁</div>
          </button>
        </section>

        <div class="stats-toolbar" aria-label="列表筛选">
          <div class="stats-toolbar-top">
            <div class="stats-search-wrap">
              <span class="stats-search-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
              </span>
              <input
                id="statsSearchInput"
                type="search"
                class="input input-search"
                placeholder="搜索昵称 / sec_uid / uid"
                oninput="handleStatsSearch()"
                autocomplete="off"
              />
            </div>
            <div class="toolbar-controls">
              <label>
                排序
                <select id="sortBySelect" onchange="onSortByChange()">
                  <option value="downloads">下载数</option>
                  <option value="last_publish">最近发布</option>
                  <option value="last_check">最近检查</option>
                  <option value="last_download">最近下载</option>
                  <option value="created:desc">添加时间（新→旧）</option>
                  <option value="created:asc">添加时间（旧→新）</option>
                  <option value="nickname">昵称</option>
                </select>
              </label>
              <label>
                每页
                <select id="pageSizeSelect" onchange="onPageSizeChange()">
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </label>
            </div>
            <div class="stats-toolbar-meta">
              <div class="toolbar-hint" id="listCountHint">列表待加载</div>
              <div class="toolbar-generated" id="generatedAtHint">生成时间（上海）：-</div>
            </div>
          </div>
          <div class="filter-chips" role="group" aria-label="状态筛选">
            <button type="button" class="filter-chip active" data-filter="all" onclick="setStatusFilter('all')">全部</button>
            <button type="button" class="filter-chip" data-filter="enabled" onclick="setStatusFilter('enabled')">启用</button>
            <button type="button" class="filter-chip" data-filter="paused" onclick="setStatusFilter('paused')">暂停</button>
            <button type="button" class="filter-chip" data-filter="abnormal" onclick="setStatusFilter('abnormal')">异常</button>
            <button type="button" class="filter-chip" data-filter="silent" onclick="setStatusFilter('silent')">沉默</button>
            <button type="button" class="filter-chip" data-filter="publish_unknown" onclick="setStatusFilter('publish_unknown')">未知发布</button>
          </div>
        </div>

        <div class="stack-col">
          <div class="card" id="monitor-users">
            <div class="card-header">
              <div>
                <div class="card-title">监控用户</div>
                <div class="card-subtitle">服务端筛选 · 分页 · 行内操作（检查 / 回填 / 复制 / 启停 / 删除）</div>
              </div>
              <span class="pill primary" id="rankCountBadge">-</span>
            </div>
            <div id="userTableList" class="table-list">
              <div class="empty-state">正在加载用户表…</div>
            </div>
            <div class="pagination-bar" id="userTablePagination">
              <div class="pagination-meta" id="paginationMeta">共 0 人</div>
              <div class="pagination-controls">
                <button type="button" class="btn btn-secondary btn-sm" id="pageFirstBtn" onclick="goPage(1)" title="首页">«</button>
                <button type="button" class="btn btn-secondary btn-sm" id="pagePrevBtn" onclick="goPage(tableState.page - 1)" title="上一页">‹</button>
                <span class="page-indicator" id="pageIndicator">1 / 1</span>
                <button type="button" class="btn btn-secondary btn-sm" id="pageNextBtn" onclick="goPage(tableState.page + 1)" title="下一页">›</button>
                <button type="button" class="btn btn-secondary btn-sm" id="pageLastBtn" onclick="goPage(tableState.totalPages)" title="末页">»</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="sidebarOverlay" class="overlay" onclick="toggleSidebar()"></div>
  <div class="works-overlay" id="worksOverlay" onclick="onWorksOverlayBackdrop(event)">
    <div class="works-overlay-panel">
      <div class="works-overlay-head">
        <div class="works-overlay-title">作品浏览</div>
        <button class="btn-icon" onclick="closeWorksOverlay()" aria-label="关闭作品浏览">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <iframe class="works-overlay-frame" id="worksFrame" title="用户作品列表"></iframe>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/static/common.js?v=theme-20260920a"></script>
  <script>
    const Icons = {
      play: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>`,
      pause: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" /></svg>`,
      bolt: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" /></svg>`,
      trash: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>`,
      checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`,
      exclamation: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" /></svg>`,
      clipboard: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" /></svg>`
    };

    let refreshSeq = 0;
    let tableSeq = 0;
    let searchTimer = null;
    let cachedSummary = null;
    let cachedGeneratedAt = null;

    const tableState = {
      search: "",
      monitor: "all",
      account: "all",
      activity: "all",
      sortBy: "downloads",
      sortOrder: "desc",
      page: 1,
      pageSize: 20,
      items: [],
      total: 0,
      totalPages: 1,
      loading: false,
      statusFilter: "all",
    };

    function isMobileViewport() {
      return window.matchMedia("(max-width: 1024px)").matches;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function formatPercent(value) {
      return `${Number(value || 0).toFixed(1)}%`;
    }

    function formatDays(value) {
      if (value == null) return "未知";
      if (Number(value) <= 0) return "今天";
      return `${value} 天前`;
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<div style="color:${type === "success" ? "var(--success)" : "var(--danger)"}">${type === "success" ? Icons.checkCircle : Icons.exclamation}</div><div style="font-size:14px; font-weight:500;">${escapeHtml(message)}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add("show")));
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 头像是作品列表的入口；user.id 是服务端 uuid，可安全插进 href
    function worksPageUrl(userId) {
      return `/api/monitor/works/dashboard?user_id=${encodeURIComponent(userId)}`;
    }

    function wrapAvatarWithWorksLink(user, innerHtml) {
      const userId = String(user.id || "").trim();
      if (!userId) return innerHtml;
      // 保留 href：Ctrl/Cmd/中键仍可在新标签页打开独立作品页
      return `<a class="user-avatar-link" href="${worksPageUrl(userId)}" onclick="return onAvatarClick(event, '${userId}')" title="查看作品列表">${innerHtml}</a>`;
    }

    // --- 作品浮层：不跳页，所以返回时筛选/页码/滚动位置都还在 ---
    const worksOverlayState = { open: false };

    function onAvatarClick(event, userId) {
      // 带修饰键或非左键时交回浏览器，走原生新标签页行为
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
      if (typeof event.button === "number" && event.button !== 0) return true;
      event.preventDefault();
      openWorksOverlay(userId);
      return false;
    }

    function openWorksOverlay(userId) {
      const id = String(userId || "").trim();
      if (!id) return;
      document.getElementById("worksFrame").src = `${worksPageUrl(id)}&embed=1`;
      document.getElementById("worksOverlay").classList.add("show");
      worksOverlayState.open = true;
      // 压一个历史条目，让浏览器返回键关掉浮层而不是离开本页
      history.pushState({ worksOverlay: id }, "");
    }

    function closeWorksOverlay(options = {}) {
      if (!worksOverlayState.open) return;
      worksOverlayState.open = false;
      document.getElementById("worksOverlay").classList.remove("show");
      // 清空 iframe 让里面的视频停止拉流，否则代理连接会挂着继续下载
      document.getElementById("worksFrame").src = "about:blank";
      if (!options.fromHistory) history.back();
    }

    function onWorksOverlayBackdrop(event) {
      if (event.target === document.getElementById("worksOverlay")) closeWorksOverlay();
    }

    window.addEventListener("popstate", () => closeWorksOverlay({ fromHistory: true }));

    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.data && event.data.type === "works:close") closeWorksOverlay();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeWorksOverlay();
    });

    function renderUserAvatar(user) {
      const initial = escapeHtml((user.nickname || user.sec_user_id || "?").charAt(0).toUpperCase());
      const avatarUrl = String(user.avatar_url || "").trim();
      if (!avatarUrl) return wrapAvatarWithWorksLink(user, `<div class="user-avatar">${initial}</div>`);
      const userId = encodeURIComponent(String(user.id || "").trim());
      if (!userId) return `<div class="user-avatar">${initial}</div>`;
      // 只随头像地址变化，巡检刷新 updated_at 不再让浏览器缓存失效
      const version = encodeURIComponent(avatarUrl);
      const safeUrl = `${API_BASE}/users/${userId}/avatar?v=${version}`;
      const avatarHtml = `<div class="user-avatar"><img src="${safeUrl}" alt="${initial}" loading="lazy" onerror="this.remove();this.parentElement.textContent=this.alt;" /></div>`;
      return wrapAvatarWithWorksLink(user, avatarHtml);
    }

    function getAccountStatusLabel(user) {
      return escapeHtml(String(user.account_status_label || "正常").trim() || "正常");
    }

    function getAccountStatusPillClass(user) {
      const status = String(user.account_status || "normal").trim();
      if (status === "deleted") return "danger";
      if (status === "banned") return "warning";
      if (status && status !== "normal") return "warning";
      return "secondary";
    }

    function getHistorySync(user) {
      return user && typeof user.history_sync === "object" && user.history_sync ? user.history_sync : {};
    }

    function formatHistorySync(historySync) {
      const status = String(historySync.status || "idle").trim();
      const labelMap = {
        pending: "待回填",
        running: "回填中",
        paused: "已暂停",
        completed: "已完成",
        failed: "部分失败",
        idle: "未启动",
      };
      const label = labelMap[status] || status || "未启动";
      const pages = Number(historySync.processed_pages || 0);
      const downloaded = Number(historySync.downloaded_items || 0);
      return `历史: ${label} · 页数 ${pages} · 已补 ${downloaded}`;
    }

    function isHistorySyncActive(historySync) {
      const status = String((historySync || {}).status || "").trim();
      return ["pending", "running", "failed"].includes(status);
    }

    function renderToggleUserButton(user) {
      const paused = !user.enabled;
      const label = paused ? `${Icons.play} 启用` : `${Icons.pause} 暂停`;
      const title = paused ? "启用" : "暂停";
      return `<button class="btn btn-secondary btn-sm" onclick="toggleUser('${user.id}', ${paused})" title="${title}">${label}</button>`;
    }

    function renderCopyUserButton(user) {
      const profileUrl = jsAttr(user.profile_url || "");
      const nickname = jsAttr(user.nickname || user.sec_user_id || "");
      return `<button class="btn btn-secondary btn-sm" onclick="copyUserProfile('${profileUrl}', '${nickname}')" title="复制主页链接">${Icons.clipboard} 复制</button>`;
    }

    function renderHistoryAction(user) {
      const historySync = getHistorySync(user);
      if (String(historySync.status || "") === "paused") {
        return `<button class="btn btn-secondary btn-sm" onclick="resumeHistoryBackfill('${user.id}')" title="继续历史回填">继续回填</button>`;
      }
      if (isHistorySyncActive(historySync)) {
        return `<button class="btn btn-secondary btn-sm" onclick="pauseHistoryBackfill('${user.id}')" title="暂停历史回填">暂停回填</button>`;
      }
      const label = String(historySync.status || "") === "completed" ? "重扫历史" : "补历史";
      return `<button class="btn btn-secondary btn-sm" onclick="startHistoryBackfill('${user.id}')" title="启动历史回填">${label}</button>`;
    }

    function scrollToUserTable() {
      const el = document.getElementById("monitor-users");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function syncFilterChips() {
      document.querySelectorAll(".filter-chip").forEach((chip) => {
        chip.classList.toggle("active", chip.dataset.filter === tableState.statusFilter);
      });
    }

    // 排序下拉取值支持 "field" 与 "field:order" 两种形式，后者用于同一字段的正/倒序（添加时间）
    function parseSortOption(raw) {
      const [field, order] = String(raw || "").trim().split(":");
      const sortBy = field || "downloads";
      if (order === "asc" || order === "desc") return { sortBy, sortOrder: order };
      return { sortBy, sortOrder: sortBy === "nickname" ? "asc" : "desc" };
    }

    function currentSortOptionValue(selectEl) {
      const field = tableState.sortBy || "downloads";
      const explicit = `${field}:${tableState.sortOrder || "desc"}`;
      const hasExplicit = selectEl
        && Array.from(selectEl.options).some((opt) => opt.value === explicit);
      return hasExplicit ? explicit : field;
    }

    function syncToolbarControls() {
      const sortEl = document.getElementById("sortBySelect");
      const sizeEl = document.getElementById("pageSizeSelect");
      if (sortEl) sortEl.value = currentSortOptionValue(sortEl);
      if (sizeEl) sizeEl.value = String(tableState.pageSize);
    }

    function applyFilterPreset(preset, { resetPage = true, scroll = true } = {}) {
      tableState.monitor = "all";
      tableState.account = "all";
      tableState.activity = "all";
      tableState.statusFilter = preset || "all";

      switch (preset) {
        case "enabled":
          tableState.monitor = "enabled";
          break;
        case "paused":
          tableState.monitor = "paused";
          break;
        case "abnormal":
          tableState.account = "abnormal";
          break;
        case "silent":
          tableState.activity = "silent_7d";
          break;
        case "publish_unknown":
          tableState.activity = "publish_unknown";
          break;
        case "all":
        default:
          tableState.statusFilter = "all";
          break;
      }

      if (resetPage) tableState.page = 1;
      syncFilterChips();
      if (scroll) scrollToUserTable();
      loadUserTable();
    }

    function setStatusFilter(nextFilter) {
      applyFilterPreset(nextFilter || "all");
    }

    function applyActivityFilter(activity) {
      tableState.monitor = "all";
      tableState.account = "all";
      tableState.activity = activity || "all";
      tableState.statusFilter = activity === "silent_7d"
        ? "silent"
        : activity === "publish_unknown"
          ? "publish_unknown"
          : "all";
      if (activity === "silent_30d") {
        // no dedicated chip; clear active chip visual to avoid lying
        tableState.statusFilter = "silent";
      }
      tableState.page = 1;
      syncFilterChips();
      if (activity === "silent_30d") {
        // keep silent chip active as nearest match
        document.querySelectorAll(".filter-chip").forEach((chip) => {
          chip.classList.toggle("active", chip.dataset.filter === "silent");
        });
      }
      scrollToUserTable();
      loadUserTable();
    }

    function onSummaryClick(kind) {
      if (kind === "users") applyFilterPreset("all");
      else if (kind === "silent") applyFilterPreset("silent");
      else if (kind === "abnormal") applyFilterPreset("abnormal");
    }

    function handleStatsSearch() {
      const input = document.getElementById("statsSearchInput");
      const next = String(input?.value || "");
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        tableState.search = next;
        tableState.page = 1;
        loadUserTable();
      }, 300);
    }

    function onSortByChange() {
      const el = document.getElementById("sortBySelect");
      const parsed = parseSortOption(el?.value);
      tableState.sortBy = parsed.sortBy;
      tableState.sortOrder = parsed.sortOrder;
      tableState.page = 1;
      loadUserTable();
    }

    function onPageSizeChange() {
      const el = document.getElementById("pageSizeSelect");
      const next = Number(el?.value || 20);
      tableState.pageSize = [20, 50, 100].includes(next) ? next : 20;
      tableState.page = 1;
      loadUserTable();
    }

    function goPage(page) {
      const target = Math.max(1, Math.min(Number(page) || 1, tableState.totalPages || 1));
      if (target === tableState.page && tableState.items.length) return;
      tableState.page = target;
      loadUserTable();
    }

    function buildUsersQuery() {
      const params = new URLSearchParams();
      params.set("page", String(tableState.page || 1));
      params.set("page_size", String(tableState.pageSize || 20));
      params.set("sort_by", tableState.sortBy || "downloads");
      params.set("sort_order", tableState.sortOrder || "desc");
      params.set("monitor", tableState.monitor || "all");
      params.set("account", tableState.account || "all");
      params.set("activity", tableState.activity || "all");
      const keyword = String(tableState.search || "").trim();
      if (keyword) params.set("search", keyword);
      return params.toString();
    }

    function updateToolbarHint() {
      const filterLabel = {
        all: "全部",
        enabled: "启用",
        paused: "暂停",
        abnormal: "异常",
        silent: "沉默",
        publish_unknown: "未知发布",
      }[tableState.statusFilter] || "全部";
      const keyword = String(tableState.search || "").trim();
      let hint = `${filterLabel} · 共 ${formatNumber(tableState.total)} 人`;
      if (keyword) hint += ` · “${keyword}”`;
      if (tableState.loading) hint += " · 加载中…";
      document.getElementById("listCountHint").textContent = hint;
      document.getElementById("rankCountBadge").textContent = `共 ${formatNumber(tableState.total)}`;
    }

    function renderPagination() {
      const totalPages = Math.max(1, Number(tableState.totalPages || 1));
      const page = Math.max(1, Math.min(Number(tableState.page || 1), totalPages));
      document.getElementById("paginationMeta").textContent =
        `共 ${formatNumber(tableState.total)} 人 · 每页 ${tableState.pageSize}`;
      document.getElementById("pageIndicator").textContent = `${page} / ${totalPages}`;
      const atFirst = page <= 1;
      const atLast = page >= totalPages;
      document.getElementById("pageFirstBtn").disabled = atFirst;
      document.getElementById("pagePrevBtn").disabled = atFirst;
      document.getElementById("pageNextBtn").disabled = atLast;
      document.getElementById("pageLastBtn").disabled = atLast;
    }

    function renderUserTableRows() {
      const root = document.getElementById("userTableList");
      const items = Array.isArray(tableState.items) ? tableState.items : [];
      if (tableState.loading && !items.length) {
        root.innerHTML = `<div class="empty-state">正在加载用户表…</div>`;
        return;
      }
      if (!items.length) {
        const keyword = String(tableState.search || "").trim();
        const msg = keyword || tableState.statusFilter !== "all"
          ? "没有匹配当前筛选的用户"
          : "暂无监控用户";
        root.innerHTML = `<div class="empty-state">${escapeHtml(msg)}</div>`;
        return;
      }

      const baseRank = (Math.max(1, tableState.page) - 1) * Math.max(1, tableState.pageSize);
      root.innerHTML = items.map((user, index) => {
        const rank = baseRank + index + 1;
        const paused = !user.enabled;
        const historySync = getHistorySync(user);
        const isAbnormal = String(user.account_status || "normal").trim() !== "normal";
        const pillClass = isAbnormal
          ? getAccountStatusPillClass(user)
          : (paused ? "secondary" : "success");
        const pillText = isAbnormal
          ? getAccountStatusLabel(user)
          : (paused ? "已暂停" : "监控中");
        const worksLabel = `视频 ${formatNumber(user.known_video_posts)} / 图集 ${formatNumber(user.known_image_posts)}`;
        const publishValue = user.activity_known
          ? escapeHtml(formatDays(user.days_since_last_publish))
          : "暂无";
        const publishNote = user.activity_known
          ? `发布 ${escapeHtml(formatTime(user.last_publish_at, "—"))}`
          : "无发布时间";
        const metaHtml = [
          `最近检查 ${escapeHtml(formatTime(user.last_checked_at, "暂无"))}`,
          `添加 ${escapeHtml(formatTime(user.created_at, "未知"))}`,
          escapeHtml(formatHistorySync(historySync)),
        ].map((bit) => `<span>${bit}</span>`).join("");
        const errorHtml = user.last_error
          ? `<div class="row-error">异常: ${escapeHtml(user.last_error)}</div>`
          : "";
        const downloads = user.total_downloaded_works ?? user.downloaded_count ?? 0;
        return `
          <div class="rank-row">
            <div class="rank-badge">#${rank}</div>
            <div class="rank-main">
              <div class="user-identity">
                ${renderUserAvatar(user)}
                <div class="user-details">
                  <div class="user-name">
                    <span class="user-name-text">${escapeHtml(user.nickname || user.sec_user_id || "-")}</span>
                    <span class="pill ${pillClass}">${pillText}</span>
                  </div>
                  <div class="rank-meta">${metaHtml}</div>
                  ${errorHtml}
                </div>
              </div>
              <div class="rank-metrics">
                <div class="rank-metric">
                  <strong>${formatNumber(downloads)}</strong>
                  <span>${worksLabel}</span>
                </div>
                <div class="rank-metric">
                  <strong>${publishValue}</strong>
                  <span class="rank-metric-note">${publishNote}</span>
                </div>
              </div>
            </div>
            <div class="row-actions">
              <button class="btn btn-secondary btn-sm" onclick="runUserOnce('${user.id}')" title="单独检查">${Icons.bolt} 检查</button>
              ${renderHistoryAction(user)}
              ${renderCopyUserButton(user)}
              ${renderToggleUserButton(user)}
              <button class="btn btn-secondary btn-sm" style="color: var(--danger);" onclick="deleteUser('${user.id}')" title="删除">${Icons.trash}</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderStatus(status, summary) {
      const dot = document.getElementById("runStateDot");
      const text = document.getElementById("runStateText");
      if (status.is_running) {
        dot.classList.add("running");
        text.textContent = "运行中";
      } else {
        dot.classList.remove("running");
        text.textContent = "已停止";
      }
      const coverageBadge = document.getElementById("coverageBadge");
      if (coverageBadge) {
        coverageBadge.textContent = formatPercent((summary || {}).structured_coverage_percent);
      }
    }

    function renderSummary(summary, generatedAt) {
      summary = summary || {};
      document.getElementById("summaryUsers").textContent = formatNumber(summary.total_users);
      document.getElementById("summaryUsersHelp").textContent =
        `启用 ${formatNumber(summary.enabled_users)} / 暂停 ${formatNumber(summary.paused_users)}`;

      document.getElementById("summaryWorks").textContent = formatNumber(summary.total_downloaded_works);
      document.getElementById("summaryWorksHelp").textContent =
        `人均 ${summary.avg_downloaded_works_per_user || 0} · 视频 ${formatNumber(summary.known_video_posts)} / 图集 ${formatNumber(summary.known_image_posts)}`;

      document.getElementById("summaryCoverage").textContent = formatPercent(summary.structured_coverage_percent);
      document.getElementById("summaryCoverageHelp").textContent =
        `已归档 ${formatNumber(summary.structured_work_count)} 条`;

      document.getElementById("summarySilent").textContent =
        `${formatNumber(summary.silent_users_7d)} / ${formatNumber(summary.silent_users_30d)}`;
      document.getElementById("summarySilentHelp").textContent =
        `未知发布 ${formatNumber(summary.unknown_publish_users)}`;

      document.getElementById("summaryAbnormal").textContent = formatNumber(summary.abnormal_users);
      document.getElementById("summaryAbnormalHelp").textContent =
        `注销 ${formatNumber(summary.deleted_users)} / 封禁 ${formatNumber(summary.banned_users)}`;

      document.getElementById("generatedAtHint").textContent =
        `生成时间（上海）：${formatTime(generatedAt, "暂无")}`;
    }

    async function loadUserTable() {
      const seq = ++tableSeq;
      tableState.loading = true;
      updateToolbarHint();
      try {
        const data = await api(`/users?${buildUsersQuery()}`);
        if (seq !== tableSeq) return;
        tableState.items = Array.isArray(data.items) ? data.items : [];
        tableState.page = Number(data.page || tableState.page || 1);
        tableState.pageSize = Number(data.page_size || tableState.pageSize || 20);
        tableState.total = Number(data.total || 0);
        tableState.totalPages = Number(data.total_pages || 1);
        if (data.applied) {
          if (data.applied.sort_by) tableState.sortBy = data.applied.sort_by;
          if (data.applied.sort_order) tableState.sortOrder = data.applied.sort_order;
        }
        syncToolbarControls();
        tableState.loading = false;
        renderUserTableRows();
        renderPagination();
        updateToolbarHint();
      } catch (error) {
        if (seq !== tableSeq) return;
        tableState.loading = false;
        updateToolbarHint();
        document.getElementById("userTableList").innerHTML =
          `<div class="empty-state">加载失败：${escapeHtml(error.message || "未知错误")}</div>`;
        showToast(error.message, "error");
      }
    }

    async function refreshAll() {
      const seq = ++refreshSeq;
      // 用户表不依赖汇总，和 status/statistics 并行发起，少一轮串行往返
      const tableTask = loadUserTable();
      try {
        const [status, statistics] = await Promise.all([
          api("/status"),
          api("/statistics"),
        ]);
        if (seq !== refreshSeq) return;
        cachedSummary = statistics.summary || {};
        cachedGeneratedAt = statistics.generated_at;
        renderStatus(status, cachedSummary);
        renderSummary(cachedSummary, cachedGeneratedAt);
      } catch (error) {
        if (seq !== refreshSeq) return;
        showToast(error.message, "error");
      }
      await tableTask;
    }

    async function toggleUser(userId, enabled) {
      try {
        await api(`/users/${userId}`, {
          method: "PATCH",
          body: JSON.stringify({ enabled }),
        });
        showToast(enabled ? "已启用" : "已暂停");
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function deleteUser(userId) {
      if (!confirm("确定要删除该用户的监控任务及相关数据吗？")) return;
      try {
        await api(`/users/${userId}`, { method: "DELETE" });
        showToast("用户已删除");
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function runUserOnce(userId) {
      try {
        showToast("已下发检查任务...");
        const res = await api(`/users/${userId}/run_once`, { method: "POST" });
        showToast(`下载了 ${res.downloaded_items || 0} 个作品`);
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function startHistoryBackfill(userId) {
      try {
        await api(`/users/${userId}/backfill/start`, { method: "POST" });
        showToast("已启动历史回填");
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function pauseHistoryBackfill(userId) {
      try {
        await api(`/users/${userId}/backfill/pause`, { method: "POST" });
        showToast("已暂停历史回填");
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    async function resumeHistoryBackfill(userId) {
      try {
        await api(`/users/${userId}/backfill/resume`, { method: "POST" });
        showToast("已恢复历史回填");
        await refreshAll();
      } catch (error) {
        showToast(error.message, "error");
      }
    }

    syncToolbarControls();
    syncFilterChips();
    refreshAll();
    // 浮层打开时表格不可见，跳过轮询：省掉无谓请求，也避免关掉浮层瞬间表格刚被重绘
    setInterval(() => {
      if (!worksOverlayState.open) refreshAll();
    }, 15000);
  </script>
</body>
</html>
