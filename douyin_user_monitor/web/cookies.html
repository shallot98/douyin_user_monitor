<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie 池 | Monitor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --bg-body: #f1f5f9; --bg-surface: #ffffff; --bg-sidebar: #1e293b; --bg-sidebar-hover: #334155;
      --text-main: #1e293b; --text-muted: #64748b; --text-lighter: #94a3b8; --text-inverse: #f8fafc;
      --border-color: #e2e8f0; --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #e0e7ff;
      --success: #10b981; --success-light: #d1fae5; --danger: #ef4444; --danger-hover: #dc2626; --danger-light: #fee2e2;
      --warning: #f59e0b; --warning-light: #fef3c7;
      --radius-sm: 4px; --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden;
      -webkit-font-smoothing: antialiased; line-height: 1.5;
    }
    .sidebar {
      width: 260px; background: var(--bg-sidebar); color: var(--text-inverse);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 40;
    }
    .sidebar-header {
      height: 64px; display: flex; align-items: center; padding: 0 24px;
      font-size: 18px; font-weight: 700; gap: 10px; background: rgba(15,23,42,.2);
    }
    .sidebar-header svg { width: 28px; height: 28px; color: #818cf8; }
    .sidebar-nav { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .nav-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin: 8px 0 4px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius);
      color: var(--text-lighter); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .nav-item:hover { background: var(--bg-sidebar-hover); color: var(--text-inverse); }
    .nav-item.active { background: rgba(79,70,229,.15); color: #818cf8; }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .app-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .top-header {
      height: 64px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    }
    .btn.mobile-sidebar-toggle { display: none; }
    .main-content { flex: 1; overflow-y: auto; padding: 32px 24px; }
    .content-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .page-title { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
    .page-sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border-color); background: #f8fafc;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-body { padding: 20px; }
    .form-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .input, .textarea {
      width: 100%; border: 1px solid var(--border-color); border-radius: var(--radius); padding: 10px 12px;
      font-size: 14px; font-family: inherit; background: #fff; color: var(--text-main);
    }
    .textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .input:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #fff; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #f8fafc; }
    .btn-danger { background: var(--danger-light); color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .cookie-list { display: flex; flex-direction: column; gap: 12px; }
    .cookie-item {
      border: 1px solid var(--border-color); border-radius: var(--radius); padding: 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
    }
    .cookie-item.active-row { border-color: #a5b4fc; background: #f5f3ff; }
    .cookie-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cookie-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; word-break: break-all; }
    .cookie-reason { font-size: 13px; margin-top: 8px; color: var(--text-main); }
    .cookie-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    }
    .badge-active { background: var(--primary-light); color: var(--primary); }
    .badge-healthy { background: var(--success-light); color: #047857; }
    .badge-expired { background: var(--danger-light); color: #b91c1c; }
    .badge-degraded { background: #fef3c7; color: #b45309; }
    .badge-unknown { background: var(--warning-light); color: #b45309; }
    .badge-none { background: #f1f5f9; color: var(--text-muted); }
    .empty { padding: 40px; text-align: center; color: var(--text-muted); }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: #0f172a; color: #fff; padding: 12px 16px; border-radius: var(--radius);
      font-size: 13px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.2); max-width: 360px;
    }
    .toast.error { background: #991b1b; }
    /* 与 dashboard 一致：默认不拦截点击；打开时 z-index 低于侧栏，避免挡导航 */
    .overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.28);
      z-index: 39; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -280px; height: 100vh; z-index: 40; }
      .sidebar.show { left: 0; }
      .btn.mobile-sidebar-toggle { display: inline-flex; border: none; background: transparent; padding: 4px; cursor: pointer; }
      .cookie-item { grid-template-columns: 1fr; }
      .cookie-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
      </svg>
      <span id="sidebarTitle">用户监控台</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Menu</div>
      <a class="nav-item" href="/api/monitor/dashboard" onclick="return navigateToPage('/api/monitor/dashboard')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
        数据大盘
      </a>
      <a class="nav-item" href="/api/monitor/statistics/dashboard" onclick="return navigateToPage('/api/monitor/statistics/dashboard')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75h9A2.25 2.25 0 0 1 18.75 6v12A2.25 2.25 0 0 1 16.5 20.25h-9A2.25 2.25 0 0 1 5.25 18V6A2.25 2.25 0 0 1 7.5 3.75Zm1.5 4.5h6m-6 3h6m-6 3h3" /></svg>
        用户统计
      </a>
      <a class="nav-item active" href="/api/monitor/cookies/dashboard" onclick="return navigateToPage('/api/monitor/cookies/dashboard')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" /></svg>
        Cookie 池
      </a>
      <a class="nav-item" onclick="refreshList()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
        刷新列表
      </a>
    </nav>
  </aside>

  <div class="app-wrapper">
    <header class="top-header">
      <button class="btn btn-secondary mobile-sidebar-toggle" onclick="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
      </button>
      <div style="font-size:13px;color:var(--text-muted);">列表仅显示脱敏预览，完整 Cookie 不会回传前端</div>
    </header>

    <main class="main-content">
      <div class="content-container">
        <div>
          <h1 class="page-title">Cookie 池</h1>
          <p class="page-sub">维护多条抖音 Web Cookie；监控同步时按轮换分散使用。手动「设为启用」写入默认爬虫 Cookie。</p>
        </div>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">添加 Cookie</h2>
          </div>
          <div class="card-body">
            <div class="form-row">
              <label class="form-label" for="cookieName">名称（可选）</label>
              <input id="cookieName" class="input" type="text" placeholder="例如：主号 / 备用1" />
            </div>
            <div class="form-row">
              <label class="form-label" for="cookieValue">Cookie 字符串</label>
              <textarea id="cookieValue" class="textarea" placeholder="从浏览器复制完整 Cookie..."></textarea>
            </div>
            <button id="btnAddCookie" class="btn btn-primary" onclick="addCookie()">添加到池</button>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">池内 Cookie <span id="cookieCountText" style="color:var(--text-muted);font-weight:500;">(0)</span></h2>
            <button class="btn btn-secondary btn-sm" onclick="refreshList()">刷新</button>
          </div>
          <div class="card-body" style="padding:16px;">
            <div id="cookieList" class="cookie-list">
              <div class="empty">加载中...</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="sidebarOverlay" class="overlay" onclick="toggleSidebar()"></div>
  <div id="toast-container" class="toast-container"></div>

  <script>
    const API_BASE = "/api/monitor";
    const SHANGHAI_TIME_ZONE = "Asia/Shanghai";

    function isMobileViewport() {
      return window.innerWidth <= 900;
    }

    function closeSidebarMobile() {
      document.getElementById("sidebar").classList.remove("show");
      document.getElementById("sidebarOverlay").classList.remove("show");
    }

    function toggleSidebar() {
      if (!isMobileViewport()) {
        closeSidebarMobile();
        return false;
      }
      document.getElementById("sidebar").classList.toggle("show");
      document.getElementById("sidebarOverlay").classList.toggle("show");
      return false;
    }

    function navigateToPage(path) {
      closeSidebarMobile();
      if (window.location.pathname === path) return false;
      window.location.assign(path);
      return false;
    }

    window.addEventListener("resize", () => {
      if (!isMobileViewport()) closeSidebarMobile();
    });

    function showToast(message, type = "success") {
      const el = document.createElement("div");
      el.className = `toast${type === "error" ? " error" : ""}`;
      el.textContent = message;
      document.getElementById("toast-container").appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.code !== 200) {
        throw new Error(data?.detail?.message || data?.detail || data?.message || "请求失败");
      }
      return data.data;
    }

    function formatTime(value, fallback = "-") {
      if (!value) return fallback;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: SHANGHAI_TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
      }).format(date);
    }

    function statusBadge(status) {
      const s = String(status || "").trim();
      if (s === "healthy") return '<span class="badge badge-healthy">healthy</span>';
      if (s === "expired") return '<span class="badge badge-expired">expired</span>';
      if (s === "degraded") return '<span class="badge badge-degraded">degraded</span>';
      if (s === "unknown") return '<span class="badge badge-unknown">unknown</span>';
      return '<span class="badge badge-none">未检测</span>';
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderList(items) {
      const root = document.getElementById("cookieList");
      const count = document.getElementById("cookieCountText");
      count.textContent = `(${items.length})`;
      if (!items.length) {
        root.innerHTML = '<div class="empty">池为空。若爬虫 yaml 已有 Cookie，刷新后会自动导入「默认 Cookie」。</div>';
        return;
      }
      root.innerHTML = items.map((item) => {
        const id = escapeHtml(item.id);
        const active = !!item.is_active;
        return `
          <div class="cookie-item${active ? " active-row" : ""}" data-id="${id}">
            <div>
              <div class="cookie-name">
                ${escapeHtml(item.name || "未命名")}
                ${active ? '<span class="badge badge-active">当前启用</span>' : ""}
                ${statusBadge(item.status)}
              </div>
              <div class="cookie-meta">预览：${escapeHtml(item.cookie_preview || "")}</div>
              <div class="cookie-meta">测活时间：${escapeHtml(formatTime(item.last_check_at))} · 样本 ${Number(item.samples_used || 0)}</div>
              <div class="cookie-meta">轮换使用：${Number(item.use_count || 0)} 次 · 鉴权失败连击 ${Number(item.auth_fail_streak || 0)} · 最近 ${escapeHtml(formatTime(item.last_used_at))}</div>
              <div class="cookie-reason">${escapeHtml(item.reason || item.last_error || "尚无测活结果")}</div>
            </div>
            <div class="cookie-actions">
              <button class="btn btn-secondary btn-sm" onclick="checkCookie('${id}')">测活</button>
              <button class="btn btn-primary btn-sm" onclick="activateCookie('${id}')" ${active ? "disabled" : ""}>设为启用</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCookie('${id}')" ${active ? "disabled title='请先启用其他 Cookie'" : ""}>删除</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function refreshList() {
      try {
        const data = await api("/cookies");
        renderList(data.items || []);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function addCookie() {
      const name = document.getElementById("cookieName").value.trim();
      const cookie = document.getElementById("cookieValue").value.trim();
      if (!cookie) {
        showToast("请填写 Cookie 字符串", "error");
        return;
      }
      const btn = document.getElementById("btnAddCookie");
      btn.disabled = true;
      try {
        await api("/cookies", {
          method: "POST",
          body: JSON.stringify({ cookie, name: name || null }),
        });
        document.getElementById("cookieName").value = "";
        document.getElementById("cookieValue").value = "";
        showToast("已添加");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    async function checkCookie(id) {
      try {
        showToast("正在测活...");
        const item = await api(`/cookies/${encodeURIComponent(id)}/check`, { method: "POST" });
        showToast(`测活完成: ${item.status || "unknown"}`);
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function activateCookie(id) {
      try {
        await api(`/cookies/${encodeURIComponent(id)}/activate`, { method: "POST" });
        showToast("已设为当前启用");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function deleteCookie(id) {
      if (!confirm("确认删除该 Cookie？")) return;
      try {
        await api(`/cookies/${encodeURIComponent(id)}`, { method: "DELETE" });
        showToast("已删除");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    refreshList();
  </script>
</body>
</html>
