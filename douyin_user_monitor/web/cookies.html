<script src="/static/common.js?v=sky-20260806h"></script>
  <script>
    // API_BASE、api()、时间格式化、侧栏函数（toggleSidebar 等）见 common.js。
    // isMobileViewport 各页断点不同（本页 1024），保留在本页由 common.js 在调用时引用。
    function isMobileViewport() {
      return window.matchMedia("(max-width: 1024px)").matches;
    }

    function showToast(message, type = "success") {
      const el = document.createElement("div");
      el.className = `toast${type === "error" ? " error" : ""}`;
      el.textContent = message;
      document.getElementById("toast-container").appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // api() 与 formatTime()（统一上海时区版）见 common.js。
    function statusBadge(status) {
      const s = String(status || "").trim();
      if (s === "healthy") return '<span class="badge badge-healthy">healthy</span>';
      if (s === "expired") return '<span class="badge badge-expired">expired</span>';
      if (s === "degraded") return '<span class="badge badge-degraded">degraded</span>';
      if (s === "unknown") return '<span class="badge badge-unknown">unknown</span>';
      return '<span class="badge badge-none">未检测</span>';
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderList(items) {
      const root = document.getElementById("cookieList");
      const count = document.getElementById("cookieCountText");
      count.textContent = `(${items.length})`;
      if (!items.length) {
        root.innerHTML = '<div class="empty">池为空。若爬虫 yaml 已有 Cookie，刷新后会自动导入「默认 Cookie」。</div>';
        return;
      }
      root.innerHTML = items.map((item) => {
        const id = escapeHtml(item.id);
        const active = !!item.is_active;
        return `
          <div class="cookie-item${active ? " active-row" : ""}" data-id="${id}">
            <div>
              <div class="cookie-name">
                ${escapeHtml(item.name || "未命名")}
                ${active ? '<span class="badge badge-active">当前启用</span>' : ""}
                ${statusBadge(item.status)}
              </div>
              <div class="cookie-meta">预览：${escapeHtml(item.cookie_preview || "")}</div>
              <div class="cookie-meta">测活时间：${escapeHtml(formatTime(item.last_check_at))} · 样本 ${Number(item.samples_used || 0)}</div>
              <div class="cookie-meta">轮换使用：${Number(item.use_count || 0)} 次 · 鉴权失败连击 ${Number(item.auth_fail_streak || 0)} · 最近 ${escapeHtml(formatTime(item.last_used_at))}</div>
              <div class="cookie-reason">${escapeHtml(item.reason || item.last_error || "尚无测活结果")}</div>
            </div>
            <div class="cookie-actions">
              <button class="btn btn-secondary btn-sm" onclick="checkCookie('${id}')">测活</button>
              <button class="btn btn-primary btn-sm" onclick="activateCookie('${id}')" ${active ? "disabled" : ""}>设为启用</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCookie('${id}')" ${active ? "disabled title='请先启用其他 Cookie'" : ""}>删除</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function refreshList() {
      try {
        const data = await api("/cookies");
        renderList(data.items || []);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function addCookie() {
      const name = document.getElementById("cookieName").value.trim();
      const cookie = document.getElementById("cookieValue").value.trim();
      if (!cookie) {
        showToast("请填写 Cookie 字符串", "error");
        return;
      }
      const btn = document.getElementById("btnAddCookie");
      btn.disabled = true;
      try {
        await api("/cookies", {
          method: "POST",
          body: JSON.stringify({ cookie, name: name || null }),
        });
        document.getElementById("cookieName").value = "";
        document.getElementById("cookieValue").value = "";
        showToast("已添加");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    async function checkCookie(id) {
      try {
        showToast("正在测活...");
        const item = await api(`/cookies/${encodeURIComponent(id)}/check`, { method: "POST" });
        showToast(`测活完成: ${item.status || "unknown"}`);
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function activateCookie(id) {
      try {
        await api(`/cookies/${encodeURIComponent(id)}/activate`, { method: "POST" });
        showToast("已设为当前启用");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function deleteCookie(id) {
      if (!confirm("确认删除该 Cookie？")) return;
      try {
        await api(`/cookies/${encodeURIComponent(id)}`, { method: "DELETE" });
        showToast("已删除");
        await refreshList();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    refreshList();
  </script>
