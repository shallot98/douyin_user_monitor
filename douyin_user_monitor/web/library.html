<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 视频直连归档 CDN 时网关带 Referer 就 403（实测），整页不发 Referer -->
  <meta name="referrer" content="no-referrer" />
  <title>作品库 | Monitor</title>
  <link rel="stylesheet" href="/static/common.css?v=theme-20261006a" />
  <style>
    /* 作品库页面样式；外壳/侧栏/按钮来自 common.css */
    .lib-container { max-width:1640px; gap:14px; }
    .s1 { --score:#0ea5e9; } .s2 { --score:#6366f1; } .s3 { --score:#d97706; } .s4 { --score:#ea580c; } .s5 { --score:#dc2626; }

    /* ---- 顶部统计 ---- */
    .lib-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .lib-stats { display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; margin-top:4px; font-size:13px; color:var(--text-muted); }
    .lib-stats b { color:var(--text-main); font-variant-numeric:tabular-nums; }
    .lib-stats .muted { color:var(--text-lighter); font-size:12px; }
    .hist { display:flex; align-items:flex-end; gap:6px; height:52px; padding:6px 10px; border-radius:12px; background:var(--bg-surface); border:1px solid var(--border-color); box-shadow:var(--shadow-sm); }
    .hist-label { align-self:center; margin-right:4px; font-size:11px; font-weight:700; color:var(--text-muted); writing-mode:horizontal-tb; }
    .hist-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; width:26px; height:100%; border:0; padding:0; background:transparent; cursor:pointer; color:var(--text-lighter); font-size:10px; font-weight:700; }
    .hist-bar { width:100%; min-height:3px; border-radius:5px 5px 2px 2px; background:var(--score); transition:height .25s ease, opacity .2s ease; }
    .hist-col.off .hist-bar { opacity:.25; }
    .hist-col:hover .hist-bar { filter:brightness(1.12); }

    /* ---- 吸顶工具栏 ---- */
    .lib-toolbar { position:sticky; top:-20px; z-index:20; margin:0 -4px; padding:10px 12px; display:flex; flex-direction:column; gap:10px; background:color-mix(in srgb, var(--bg-surface) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--border-color); border-radius:16px; box-shadow:var(--shadow); }
    /* 跟手收起：滚动中由脚本逐帧写 --tb-shift（0=完整显示，正数=向上藏起的像素），不加过渡，1:1 跟随手指；
       停下后加 .tb-snapping 用短过渡吸附到完全显示/完全藏起。只动 transform，不改布局，所以不会抖 */
    .lib-toolbar { transform:translate3d(0, calc(var(--tb-shift, 0px) * -1), 0); will-change:transform; }
    .lib-toolbar.tb-snapping { transition:transform .26s cubic-bezier(.22,1,.36,1); }
    .lib-toolbar.tb-gone { pointer-events:none; }
    /* 侧栏面板跟着工具栏一起上移，不留空档（只在桌面有吸顶侧栏时生效） */
    .filter-panel { transform:translate3d(0, calc(var(--panel-shift, 0px) * -1), 0); }
    .lib-toolbar.tb-snapping ~ .lib-body .filter-panel { transition:transform .26s cubic-bezier(.22,1,.36,1); }
    .lib-fab { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:40; display:flex; align-items:center; padding:4px; border-radius:999px; background:color-mix(in srgb, var(--bg-surface) 80%, transparent); backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4); border:1px solid var(--border-color); box-shadow:0 10px 30px rgba(15,23,42,.18); transform:translate3d(0, 14px, 0) scale(.92); opacity:0; pointer-events:none; transition:transform .24s cubic-bezier(.22,1,.36,1), opacity .18s ease; }
    .lib-fab.show { transform:none; opacity:1; pointer-events:auto; }
    .lib-fab button { border:0; background:transparent; color:var(--text-main); font:inherit; font-size:13px; font-weight:700; height:38px; padding:0 16px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; -webkit-tap-highlight-color:transparent; }
    .lib-fab button:hover { background:var(--bg-elevated); }
    .lib-fab button:active { transform:scale(.96); }
    .lib-fab button svg { width:17px; height:17px; }
    /* 播放器打开时让位，避免和悬浮播放器叠在一起 */
    body:has(.viewer.show) .lib-fab { opacity:0; pointer-events:none; }
    @media (prefers-reduced-motion: reduce) { .lib-toolbar.tb-snapping, .lib-fab { transition:none; } }
    .tb-row { display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; }
    .tb-search { position:relative; flex:1 1 260px; min-width:0; }
    .tb-search svg { position:absolute; left:11px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--text-lighter); pointer-events:none; }
    .tb-search .input { width:100%; padding-left:34px; border-radius:11px; }
    .tb-group { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .tb-label { font-size:12px; font-weight:700; color:var(--text-muted); white-space:nowrap; }
    .tb-select { width:auto; padding:6px 8px; border-radius:10px; font-size:12.5px; }
    .tb-date { width:136px; padding:5px 8px; border-radius:10px; font-size:12.5px; }
    .seg { display:inline-flex; padding:3px; gap:2px; border-radius:11px; background:var(--bg-elevated); border:1px solid var(--border-color); }
    .seg button { border:0; background:transparent; color:var(--text-muted); font:inherit; font-size:12.5px; font-weight:650; padding:5px 11px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:background .15s ease, color .15s ease; }
    .seg button svg { width:16px; height:16px; }
    .seg button[aria-pressed="true"] { background:var(--bg-surface); color:var(--accent); box-shadow:0 1px 3px rgba(15,23,42,.12); }
    .seg button:hover:not([aria-pressed="true"]) { color:var(--text-main); }
    .chip-toggle { border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-muted); font:inherit; font-size:12px; font-weight:650; padding:4px 11px; border-radius:999px; cursor:pointer; transition:all .15s ease; }
    .chip-toggle[aria-pressed="true"] { background:var(--primary-light); color:var(--accent); border-color:var(--primary); }
    .chip-toggle.excluded { color:var(--danger); border-color:var(--danger); background:var(--danger-light); text-decoration:line-through; }
    .tb-spacer { flex:1; }
    .filter-btn { position:relative; }
    .filter-btn .badge-dot { min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:11px; line-height:18px; font-weight:750; }
    /* 擦边评分双滑块：两个 range 叠在一条轨道上，只有滑块本身响应指针 */
    .dual { position:relative; width:120px; height:26px; }
    .dual-track { position:absolute; left:8px; right:8px; top:50%; height:5px; margin-top:-2.5px; border-radius:999px; background:var(--border-color); }
    .dual-fill { position:absolute; top:0; bottom:0; border-radius:999px; background:var(--primary); }
    .dual input[type="range"] { position:absolute; inset:0; width:100%; margin:0; background:transparent; pointer-events:none; -webkit-appearance:none; appearance:none; }
    .dual input[type="range"]::-webkit-slider-runnable-track { background:transparent; height:26px; }
    .dual input[type="range"]::-moz-range-track { background:transparent; }
    .dual input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:16px; height:16px; margin-top:5px; border-radius:50%; background:var(--bg-surface); border:2px solid var(--primary); box-shadow:0 1px 4px rgba(15,23,42,.25); cursor:grab; }
    .dual input[type="range"]::-moz-range-thumb { pointer-events:auto; width:12px; height:12px; border-radius:50%; background:var(--bg-surface); border:2px solid var(--primary); cursor:grab; }
    .dual input[type="range"]:focus-visible::-webkit-slider-thumb { outline:2px solid var(--primary); outline-offset:2px; }
    .score-readout { min-width:34px; font-size:12.5px; font-weight:750; color:var(--text-main); font-variant-numeric:tabular-nums; }
    .size-range { width:74px; accent-color:var(--primary); }

    /* ---- 已选条件 / 收藏的筛选 ---- */
    .chip-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .chip-row:empty { display:none; }
    .chip-row-label { font-size:12px; font-weight:700; color:var(--text-lighter); margin-right:2px; }
    .fchip { display:inline-flex; align-items:center; gap:4px; max-width:260px; padding:3px 4px 3px 10px; border-radius:999px; font-size:12px; font-weight:650; background:var(--primary-light); color:var(--accent); border:1px solid transparent; }
    .fchip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fchip.ex { background:var(--danger-light); color:var(--danger); }
    .fchip.ex span { text-decoration:line-through; }
    .fchip button, .saved-chip button { border:0; background:transparent; color:inherit; width:20px; height:20px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1; display:grid; place-items:center; opacity:.7; }
    .fchip button:hover, .saved-chip button:hover { opacity:1; background:rgba(15,23,42,.1); }
    .fchip.more { cursor:pointer; padding:3px 10px; background:var(--bg-elevated); color:var(--text-muted); border-color:var(--border-color); }
    .link-btn { border:0; background:transparent; color:var(--text-muted); font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:3px 6px; border-radius:6px; }
    .link-btn:hover { color:var(--danger); }
    .link-btn.primary:hover { color:var(--accent); }
    .saved-chip { display:inline-flex; align-items:center; gap:2px; border-radius:999px; border:1px dashed var(--border-strong); background:var(--bg-surface); font-size:12px; font-weight:650; color:var(--text-main); padding:2px 4px 2px 0; }
    .saved-chip .saved-apply { width:auto; height:auto; border-radius:999px; padding:1px 4px 1px 10px; font-size:12px; opacity:1; }
    .saved-chip .saved-apply:hover { background:transparent; color:var(--accent); }

    /* ---- 主体：侧边筛选 + 结果 ---- */
    .lib-body { display:flex; align-items:flex-start; gap:16px; }
    .lib-results { flex:1; min-width:0; }
    /* --tb-h 由脚本按吸顶工具栏实际高度写入：面板紧贴工具栏下方吸顶 */
    .filter-panel { position:sticky; top:calc(var(--tb-h, 140px) - 6px); width:280px; flex-shrink:0; max-height:calc(100vh - var(--header-height) - var(--tb-h, 140px) - 24px); display:flex; flex-direction:column; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; }
    .filter-panel[hidden] { display:none; }
    .fp-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border-color); }
    .fp-title { font-size:14px; font-weight:750; }
    .fp-handle { display:none; }
    .fp-body { overflow-y:auto; overscroll-behavior:contain; padding:4px 0 10px; }
    .fp-group { border-bottom:1px solid var(--border-color); }
    .fp-group:last-child { border-bottom:0; }
    .fp-group > summary { list-style:none; display:flex; align-items:center; gap:8px; padding:11px 14px; cursor:pointer; font-size:13px; font-weight:700; user-select:none; }
    .fp-group > summary::-webkit-details-marker { display:none; }
    .fp-group > summary::after { content:""; margin-left:auto; width:7px; height:7px; border-right:2px solid var(--text-lighter); border-bottom:2px solid var(--text-lighter); transform:rotate(45deg); transition:transform .2s ease; }
    .fp-group[open] > summary::after { transform:rotate(225deg); }
    .fp-count { min-width:18px; height:18px; padding:0 6px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:11px; line-height:18px; font-weight:750; }
    .fp-content { padding:0 14px 12px; display:flex; flex-direction:column; gap:8px; }
    .facet-list { display:flex; flex-wrap:wrap; gap:6px; }
    .facet { display:inline-flex; align-items:stretch; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-elevated); overflow:hidden; font-size:12px; transition:border-color .15s ease; }
    .facet:hover { border-color:var(--border-strong); }
    .facet button { border:0; background:transparent; color:var(--text-main); font:inherit; cursor:pointer; }
    .facet-inc { display:inline-flex; align-items:center; gap:5px; padding:3px 4px 3px 10px; font-weight:600; }
    .facet-inc .count { font-size:10.5px; font-weight:700; color:var(--text-lighter); font-variant-numeric:tabular-nums; }
    .facet-ex { width:22px; color:var(--text-lighter) !important; font-size:12px; opacity:.55; }
    .facet-ex:hover { opacity:1; color:var(--danger) !important; }
    .facet.on { border-color:var(--primary); background:var(--primary-light); }
    .facet.on .facet-inc, .facet.on .count { color:var(--accent); }
    .facet.ex { border-color:var(--danger); background:var(--danger-light); }
    .facet.ex .facet-inc { color:var(--danger); text-decoration:line-through; }
    .facet.ex .facet-ex { opacity:1; color:var(--danger) !important; }
    .facet.zero:not(.on):not(.ex) { opacity:.5; }
    .fp-empty { font-size:12px; color:var(--text-lighter); }
    .sub-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .sub-row .tb-label { min-width:34px; }
    .sub-row .seg button { padding:3px 8px; font-size:11.5px; }
    .user-facets { display:flex; flex-direction:column; gap:2px; max-height:260px; overflow-y:auto; margin:0 -6px; }
    .user-facet { display:flex; align-items:center; gap:8px; width:100%; border:0; background:transparent; color:var(--text-main); font:inherit; font-size:12.5px; text-align:left; padding:5px 6px; border-radius:9px; cursor:pointer; }
    .user-facet:hover { background:var(--bg-elevated); }
    .user-facet.on { background:var(--primary-light); color:var(--accent); font-weight:700; }
    .user-facet .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .user-facet .count { font-size:11px; color:var(--text-lighter); font-variant-numeric:tabular-nums; }
    .switch-row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; font-weight:650; cursor:pointer; }
    .switch-row input { width:36px; height:20px; accent-color:var(--danger); cursor:pointer; }

    /* ---- 卡片 ---- */
    .lib-grid { --col:200px; display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--col),1fr)); gap:14px; }
    .lib-grid.view-grid.size-1 { --col:156px; } .lib-grid.view-grid.size-3 { --col:260px; }
    .lib-grid.view-wall { --col:120px; gap:6px; } .lib-grid.view-wall.size-1 { --col:92px; } .lib-grid.view-wall.size-3 { --col:168px; }
    .lib-grid.view-list { grid-template-columns:1fr; gap:10px; }
    .lib-card { position:relative; border-radius:14px; background:var(--bg-surface); border:1px solid var(--border-color); box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer; outline:none; transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, border-color .2s ease; }
    .lib-card:focus-visible { box-shadow:0 0 0 3px var(--primary); }
    .lib-card.playing { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary), var(--shadow); }
    .view-wall .lib-card { border-radius:10px; }
    /* 无限滚动不做虚拟化：离屏卡片跳过布局与绘制；auto 记住渲染过的真实高度，初值按视图估 */
    .lib-card { content-visibility:auto; contain-intrinsic-size:auto 280px; }
    .view-wall .lib-card { contain-intrinsic-size:auto 170px; }
    .view-list .lib-card { contain-intrinsic-size:auto 150px; }
    .lc-cover { position:relative; aspect-ratio:3/4; overflow:hidden; background:var(--bg-elevated); }
    .lc-cover img.lc-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s ease, transform .4s ease, filter .3s ease; }
    .lc-cover img.lc-img.loaded { opacity:1; }
    .lc-cover.shimmer::before, .skeleton .lc-cover::before { content:""; position:absolute; inset:0; background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--border-color) 70%, transparent) 50%, transparent 80%); background-size:200% 100%; animation:shimmer 1.3s linear infinite; }
    @keyframes shimmer { from { background-position:150% 0; } to { background-position:-50% 0; } }
    .lc-fallback { position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:6px; color:var(--text-lighter); font-size:11.5px; font-weight:600; text-align:center; }
    .lc-fallback svg { width:26px; height:26px; margin:0 auto; opacity:.7; }
    .lib-card.dim .lc-img.loaded { filter:saturate(.55) brightness(.82); }
    .lc-badges { position:absolute; left:8px; top:8px; right:44px; display:flex; flex-wrap:wrap; gap:5px; pointer-events:none; }
    .lc-pill { display:inline-flex; align-items:center; gap:3px; height:21px; padding:0 7px; border-radius:999px; font-size:11px; font-weight:700; color:#fff; background:rgba(15,23,42,.58); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
    .lc-pill svg { width:12px; height:12px; }
    .lc-pill.cat { background:rgba(217,119,6,.9); }
    .lc-pill.warn { background:rgba(220,38,38,.9); }
    .lc-score { position:absolute; right:8px; top:8px; min-width:26px; height:26px; padding:0 6px; border-radius:9px; display:grid; place-items:center; font-size:12.5px; font-weight:800; color:#fff; background:var(--score); box-shadow:0 2px 8px rgba(0,0,0,.25); font-variant-numeric:tabular-nums; }
    .view-wall .lc-score { right:5px; top:5px; min-width:20px; height:20px; border-radius:7px; font-size:11px; }
    .lc-foot { position:absolute; left:0; right:0; bottom:0; padding:28px 9px 8px; display:flex; align-items:flex-end; gap:7px; color:#fff; background:linear-gradient(to top, rgba(2,6,23,.82), rgba(2,6,23,.35) 60%, transparent); transition:opacity .2s ease; }
    .lc-avatar { position:relative; width:24px; height:24px; flex-shrink:0; border-radius:50%; overflow:hidden; display:grid; place-items:center; font-size:11px; font-weight:800; font-style:normal; color:#fff; background:linear-gradient(145deg,#38bdf8,#0284c7); box-shadow:0 0 0 1.5px rgba(255,255,255,.7); }
    .lc-avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .lc-who { flex:1; min-width:0; line-height:1.25; }
    .lc-nick { font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.4); }
    .lc-time { font-size:10.5px; opacity:.8; }
    .lc-dur { flex-shrink:0; font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; background:rgba(15,23,42,.55); font-variant-numeric:tabular-nums; }
    .lc-hover { position:absolute; left:0; right:0; bottom:0; padding:40px 11px 11px; display:flex; flex-direction:column; gap:7px; color:#fff; background:linear-gradient(to top, rgba(2,6,23,.94), rgba(2,6,23,.78) 70%, transparent); opacity:0; transform:translateY(8px); transition:opacity .2s ease, transform .2s ease; pointer-events:none; }
    .lc-summary { font-size:12px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .bars { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:3px 7px; font-size:10.5px; }
    .bars .bl { opacity:.8; font-weight:600; }
    .bars .bt { display:block; height:5px; border-radius:999px; background:rgba(148,163,184,.3); overflow:hidden; }
    /* span 默认 inline，宽高不生效，进度条会一直是空的灰条 */
    .bars .bf { display:block; height:100%; border-radius:999px; background:var(--bar-color, #38bdf8); transition:width .3s ease; }
    .bars .bv { font-weight:700; font-variant-numeric:tabular-nums; opacity:.85; }
    .lc-tags { display:flex; flex-wrap:wrap; gap:4px; max-height:40px; overflow:hidden; }
    .lc-tags span { font-size:10.5px; line-height:17px; padding:0 7px; border-radius:999px; background:rgba(255,255,255,.16); }
    .view-wall .lc-foot, .view-wall .lc-hover, .view-wall .lc-badges { display:none; }
    /* 悬停只在真有鼠标的设备上生效，触屏不出浮层 */
    @media (hover:hover) and (pointer:fine) {
      .view-grid .lib-card:hover, .view-wall .lib-card:hover { transform:translateY(-4px); box-shadow:0 16px 36px rgba(15,23,42,.18); }
      .view-grid .lib-card:hover .lc-img.loaded { transform:scale(1.04); }
      .view-grid .lib-card:hover .lc-hover { opacity:1; transform:none; }
      .view-grid .lib-card:hover .lc-foot { opacity:0; }
      .view-list .lib-card:hover { border-color:var(--border-strong); box-shadow:var(--shadow); }
    }

    /* 列表视图 */
    .view-list .lib-card { display:flex; gap:14px; padding:10px; }
    .view-list .lc-cover { width:96px; flex-shrink:0; border-radius:10px; }
    .view-list .lc-foot, .view-list .lc-hover { display:none; }
    .view-list .lc-badges { left:5px; top:5px; right:5px; }
    .view-list .lc-badges .lc-pill:not(.media) { display:none; }
    .lr-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
    .lr-head { display:flex; align-items:center; gap:8px; min-width:0; font-size:12px; color:var(--text-muted); }
    .lr-head .lc-avatar { width:22px; height:22px; box-shadow:none; }
    .lr-nick { font-weight:750; color:var(--text-main); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lr-score { flex-shrink:0; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:800; color:#fff; background:var(--score); }
    .lr-cat { flex-shrink:0; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; color:var(--warn); background:var(--warn-light); }
    .lr-desc { font-size:13px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .lr-summary { font-size:12px; color:var(--text-muted); line-height:1.5; }
    .lr-row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
    .lr-row .bars { width:220px; flex-shrink:0; color:var(--text-muted); }
    .lr-row .bars .bt { background:var(--bg-elevated); }
    .lr-tags { flex:1; min-width:200px; display:flex; flex-wrap:wrap; gap:4px; }
    .tag-pill { font-size:11px; line-height:18px; padding:0 8px; border-radius:999px; background:var(--primary-light); color:var(--accent); }
    .tag-pill.g-outfit, .tag-pill.g-enhancers { background:color-mix(in srgb, #f97316 14%, transparent); color:#ea580c; }
    body.theme-dark .tag-pill.g-outfit, body.theme-dark .tag-pill.g-enhancers { color:#fdba74; }
    .skeleton { cursor:default; pointer-events:none; }
    .skeleton .lc-line { height:10px; margin:10px; border-radius:6px; background:var(--bg-elevated); }
    .view-list .skeleton .lc-line { flex:1; }

    /* 列表尾部：空态 / 出错 / 到底 / 加载更多 */
    .lib-state { display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 16px; text-align:center; color:var(--text-muted); font-size:13px; }
    .lib-state[hidden] { display:none; }
    .lib-state .big { font-size:15px; font-weight:750; color:var(--text-main); }
    .lib-state.end { padding:18px 16px 8px; font-size:12px; color:var(--text-lighter); }
    .lib-state.end::before, .lib-state.end::after { content:""; }
    .empty-art { width:64px; height:64px; border-radius:20px; display:grid; place-items:center; background:var(--primary-light); color:var(--accent); }
    .empty-art svg { width:30px; height:30px; }
    .sentinel { height:1px; }
    .load-more-wrap { display:flex; justify-content:center; padding:6px 0 10px; }
    .load-more-wrap[hidden] { display:none; }

    .btn:focus-visible, .seg button:focus-visible, .chip-toggle:focus-visible, .facet button:focus-visible,
    .user-facet:focus-visible, .link-btn:focus-visible, .hist-col:focus-visible, .fchip button:focus-visible,
    .saved-chip button:focus-visible, .fp-group > summary:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

    .filter-overlay { z-index:58; }
    @media (prefers-reduced-motion: reduce) {
      .lib-card, .lc-img, .lc-hover, .filter-panel, .hist-bar { transition:none !important; }
      .lc-cover.shimmer::before, .skeleton .lc-cover::before { animation:none; }
    }

    /* 平板/手机：侧边筛选改为底部抽屉 */
    @media (max-width:900px) {
      .filter-panel, .filter-panel[hidden] { display:flex; position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60; width:auto; max-height:82vh; border-radius:20px 20px 0 0; border-bottom:0; box-shadow:0 -12px 40px rgba(15,23,42,.25); transform:translateY(105%); visibility:hidden; transition:transform .28s cubic-bezier(.16,1,.3,1), visibility .28s; padding-bottom:env(safe-area-inset-bottom, 0px); }
      .filter-panel.sheet-open { transform:none; visibility:visible; }
      .fp-handle { display:block; position:absolute; left:50%; top:6px; width:38px; height:4px; margin-left:-19px; border-radius:999px; background:var(--border-strong); }
      .fp-head { padding-top:16px; }
    }
    @media (max-width:640px) {
      .lib-toolbar { top:-16px; margin:0; padding:9px 10px; border-radius:14px; }
      /* 手机上胶囊放底部居中，拇指够得着 */
      .lib-fab { right:50%; transform:translate3d(50%, 14px, 0) scale(.92); }
      .lib-fab.show { transform:translate3d(50%, 0, 0); }
      .tb-scroll { flex-wrap:nowrap; overflow-x:auto; margin:0 -10px; padding:0 10px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
      .tb-scroll::-webkit-scrollbar { display:none; }
      .tb-size { display:none !important; }
      .tb-view-text { display:none; }
      .tb-row:first-child { flex-wrap:nowrap; }
      .tb-search { flex:1 1 120px; }
      .tb-row:first-child .seg button { padding:5px 8px; }
      .hist { width:100%; justify-content:space-between; }
      .hist-col { flex:1; width:auto; }
      .lib-grid.view-grid, .lib-grid.view-grid.size-1, .lib-grid.view-grid.size-3 { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .lib-grid.view-wall, .lib-grid.view-wall.size-1, .lib-grid.view-wall.size-3 { grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
      .view-list .lc-cover { width:78px; }
      .lr-row .bars { width:100%; }
      .lr-tags { min-width:0; }
      .lr-summary { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    }
  </style>
</head>

  <div class="overlay filter-overlay" id="filterOverlay"></div>

  <!-- 工具栏收起时的呼出入口 -->
  <div class="lib-fab" id="libFab" role="toolbar" aria-label="快捷操作">
    <button type="button" id="fabFilter" aria-label="显示筛选栏">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18l-7 8.5V19l-4 1.5v-7L3 5Z" /></svg>
      <span>筛选</span><span class="badge-dot" id="fabCount" hidden>0</span>
    </button>
