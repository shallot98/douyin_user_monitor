<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 视频直连归档 CDN 时网关带 Referer 就 403（实测），整页不发 Referer -->
  <meta name="referrer" content="no-referrer" />
  <title>作品浏览 | Monitor</title>
  <link rel="stylesheet" href="/static/common.css?v=theme-20260920a" />
  <style>
    /* works page-only styles; shell/sidebar/buttons come from common.css */
    .owner-card { display:flex; align-items:center; gap:14px; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:14px 16px; }
    .owner-avatar { width:56px; height:56px; border-radius:18px; overflow:hidden; flex-shrink:0; display:grid; place-items:center; font-size:20px; font-weight:800; color:var(--on-primary); background:linear-gradient(145deg,#38bdf8,#0284c7); }
    .owner-avatar img { width:100%; height:100%; object-fit:cover; }
    .owner-main { min-width:0; flex:1; }
    .owner-name { font-size:17px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .owner-meta { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:4px; font-size:12px; color:var(--text-muted); }
    .owner-aliases { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--text-lighter); }
    .alias-chip { padding:2px 8px; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-elevated); color:var(--text-muted); font-weight:600; }

    .works-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(186px,1fr)); gap:14px; }
    .work-card { display:flex; flex-direction:column; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
    .work-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .work-cover { position:relative; aspect-ratio:3/4; background:var(--bg-elevated); overflow:hidden; }
    .work-cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .work-cover-empty { width:100%; height:100%; display:grid; place-items:center; color:var(--text-lighter); font-size:12px; }
    .work-chips { position:absolute; left:8px; top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .work-chip { font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; color:#fff; background:rgba(15,23,42,.62); backdrop-filter:blur(4px); }
    .work-chip.downloaded { background:rgba(5,150,105,.88); }
    .work-time-tag { position:absolute; right:8px; bottom:8px; font-size:11px; font-weight:700; padding:3px 7px; border-radius:8px; color:#fff; background:rgba(15,23,42,.62); }
    .work-play { position:absolute; inset:0; display:grid; place-items:center; color:#fff; pointer-events:none; }
    .work-play svg { width:40px; height:40px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
    .work-body { padding:9px 11px 11px; display:flex; flex-direction:column; gap:5px; }
    .work-desc { font-size:12.5px; line-height:1.45; min-height:36px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .work-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--text-lighter); }

    .work-card.playing { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary), var(--shadow); }

    /* 悬浮播放器：不遮挡列表，可拖动标题栏；尺寸按作品宽高比由 JS 计算 */
    .viewer { position:fixed; z-index:80; right:16px; bottom:16px; display:none; flex-direction:column; overflow:hidden; color:#e2e8f0; background:#0b1220; border:1px solid rgba(148,163,184,.2); border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.45), 0 2px 10px rgba(0,0,0,.3); }
    .viewer.show { display:flex; animation:viewer-in .18s ease-out; }
    .viewer.dragging { user-select:none; }
    @keyframes viewer-in { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:none; } }
    .viewer-head { display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; cursor:move; touch-action:none; background:#111a2e; border-bottom:1px solid rgba(148,163,184,.14); }
    .viewer-title { flex:1; min-width:0; font-size:12.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .viewer-counter { flex-shrink:0; font-size:11px; font-weight:700; color:#94a3b8; font-variant-numeric:tabular-nums; }
    .viewer-close { flex-shrink:0; width:28px; height:28px; border:0; border-radius:8px; background:transparent; color:#cbd5e1; cursor:pointer; display:grid; place-items:center; }
    .viewer-close:hover { background:rgba(148,163,184,.18); color:#fff; }
    .viewer-close svg { width:16px; height:16px; }
    .viewer-body { position:relative; }
    .viewer-stage { position:relative; width:360px; height:640px; display:grid; place-items:center; background:#000; overflow:hidden; }
    /* 绝对定位铺满舞台：grid 子项的 height:100% 会退回视频原始尺寸，大分辨率视频被裁掉一截 */
    .viewer-stage video, .viewer-stage img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; }
    .viewer-stage .empty-state { color:#94a3b8; }
    .viewer-loading { position:absolute; inset:0; display:grid; place-items:center; color:#94a3b8; font-size:12.5px; font-weight:600; }
    /* 上/下一个作品：竖排在画面右侧中部，避开视频原生控制条 */
    .viewer-works { position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:2; display:flex; flex-direction:column; gap:10px; }
    .viewer-work-btn { width:38px; height:38px; border:1px solid rgba(255,255,255,.2); border-radius:999px; background:rgba(15,23,42,.55); color:#fff; backdrop-filter:blur(6px); cursor:pointer; display:grid; place-items:center; transition:background .15s ease, opacity .15s ease; }
    .viewer-work-btn:hover:not(:disabled) { background:rgba(15,23,42,.85); }
    .viewer-work-btn:disabled { opacity:.3; cursor:not-allowed; }
    .viewer-work-btn svg { width:18px; height:18px; }
    /* 图文翻页放在底部中间，和右侧的作品切换按钮分开 */
    .viewer-pager { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; padding:3px; border-radius:999px; background:rgba(15,23,42,.62); backdrop-filter:blur(6px); font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; }
    .viewer-pager span { padding:0 6px; }
    .viewer-nav { width:28px; height:28px; border:0; border-radius:999px; background:transparent; color:#fff; cursor:pointer; display:grid; place-items:center; }
    .viewer-nav:hover { background:rgba(255,255,255,.16); }
    .viewer-nav svg { width:16px; height:16px; }
    .viewer-foot { display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; font-size:11.5px; color:#94a3b8; background:#111a2e; border-top:1px solid rgba(148,163,184,.14); }
    .viewer-meta { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .viewer-link { flex-shrink:0; padding:4px 10px; border-radius:8px; border:1px solid rgba(148,163,184,.25); color:#e2e8f0; text-decoration:none; font-weight:650; }
    .viewer-link:hover { background:rgba(148,163,184,.16); }
    .viewer-link[hidden] { display:none; }
    @media (max-width:640px) {
      .works-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .viewer { left:12px !important; right:12px; top:auto !important; bottom:calc(12px + env(safe-area-inset-bottom)); border-radius:14px; }
      .viewer-head { cursor:default; }
      .viewer-stage { width:100% !important; }
    }

    /* 分页条：与统计页用户表同一套视觉 */
    .pagination-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:12px 14px; border-top:1px solid var(--border-color); background:var(--bg-elevated); }
    .pagination-meta { font-size:12px; color:var(--text-muted); font-weight:600; }
    .pagination-controls { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .pagination-controls .btn[disabled] { opacity:.45; cursor:not-allowed; }
    .page-indicator { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .page-num { min-width:32px; }
    .page-num.active { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
    .page-ellipsis { font-size:12px; color:var(--text-lighter); padding:0 2px; }

    /* ?embed=1：作为统计页浮层的内容加载，外层已提供标题栏与关闭按钮 */
    body.embed .sidebar,
    body.embed #sidebarOverlay,
    body.embed .top-header,
    body.embed .page-header { display:none !important; }
    body.embed .main-content { padding:16px 16px 20px; }
    body.embed .content-container { max-width:none; }
  </style>

  <script>
    function isMobileViewport() { return window.innerWidth <= 1024; }

    const PAGE_QUERY = new URLSearchParams(window.location.search);
    const USER_ID = (PAGE_QUERY.get("user_id") || "").trim();
    const EMBEDDED = PAGE_QUERY.get("embed") === "1";

    if (EMBEDDED) document.body.classList.add("embed");

    // 嵌入模式下由外层浮层负责关闭，这里只把意图传出去
    function requestOverlayClose() {
      if (!EMBEDDED) return;
      window.parent.postMessage({ type: "works:close" }, window.location.origin);
    }

    // 列表只读本地 download_records，不打抖音接口（避免风控，且作品列表被隐藏的账号照样能看）。
    // 本地列表是普通数组，所以是真 offset 分页：总数/总页数已知，可任意跳页。
    const state = {
      items: [],
      page: 1,
      pageSize: 20,
      total: 0,
      totalPages: 1,
      mediaCounts: {},
      archiveEnabled: true,
      loading: false,
      user: null,
      // 播放器打开期间可以翻页：viewerItem 是正在播的作品，viewerIndex 是它在当前页的位置，
      // 不在当前页时为 -1（此时上/下一个从当前页首/尾开始）。
      viewerOpen: false,
      viewerItem: null,
      viewerIndex: -1,
      viewerBusy: false,
      viewerRatio: 9 / 16,
      viewerPos: null,
      imageIndex: 0,
      // 视频直链：aweme_id → { url: string|null, expiresAt }；null 表示只能走代理
      directUrls: new Map(),
      directPending: new Map(),
      directFailures: 0,
      directDisabled: false,
    };

    const PAGE_NUMBER_WINDOW = 3;

    function archiveMediaUrl(awemeId, fileIndex) {
      return `${API_BASE}/users/${encodeURIComponent(USER_ID)}/archive/${encodeURIComponent(awemeId)}/media/${Number(fileIndex)}`;
    }

    function coverImageUrl(item) {
      const local = String(item.cover_url || "");
      const prefix = `${API_BASE}/users/${encodeURIComponent(USER_ID)}/archive/${encodeURIComponent(item.aweme_id)}/cover?v=`;
      if (local.startsWith(prefix) && /^[0-9a-f]{64}$/.test(local.slice(prefix.length))) return local;
      return item.cover_index !== null && item.cover_index !== undefined
        ? archiveMediaUrl(item.aweme_id, item.cover_index) : "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // 作品数据来自抖音端，属不可信输入：URL 只放行 http(s)，杜绝 javascript: 之类协议
    function safeMediaUrl(value) {
      const text = String(value || "").trim();
      return /^https?:\/\//i.test(text) ? text : "";
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.textContent = String(message ?? "");
      container.appendChild(toast);
      requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add("show")));
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatCount(value) {
      const num = Number(value || 0);
      if (num >= 10000) return `${(num / 10000).toFixed(1)}万`;
      return String(num);
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.round(Number(ms || 0) / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function renderOwner(user) {
      if (!user) return;
      state.user = user;
      const nickname = String(user.nickname || user.id || "未知用户");
      document.getElementById("ownerName").textContent = nickname;
      document.title = `${nickname} 的作品 | Monitor`;

      const avatarEl = document.getElementById("ownerAvatar");
      const initial = nickname.charAt(0).toUpperCase() || "?";
      if (String(user.avatar_url || "").trim() && String(user.id || "").trim()) {
        const version = encodeURIComponent(String(user.avatar_url));
        avatarEl.innerHTML = `<img src="${API_BASE}/users/${encodeURIComponent(user.id)}/avatar?v=${version}" alt="${escapeHtml(initial)}" referrerpolicy="no-referrer" onerror="this.remove();" />`;
      } else {
        avatarEl.textContent = initial;
      }

      const bits = [
        `已下载 ${formatCount(user.downloaded_count)}`,
        user.enabled ? "监控中" : "已暂停",
        escapeHtml(String(user.account_status_label || "正常")),
      ];
      document.getElementById("ownerMeta").innerHTML = bits.map((bit) => `<span>${bit}</span>`).join("");

      // 曾用名同时是网盘上历史归档目录的名字，便于对应散落的文件夹
      const aliases = (Array.isArray(user.former_nicknames) ? user.former_nicknames : [])
        .map((name) => String(name || "").trim())
        .filter(Boolean);
      const aliasEl = document.getElementById("ownerAliases");
      if (aliases.length) {
        aliasEl.innerHTML = `<span>曾用名 / 归档目录</span>${aliases
          .map((name) => `<span class="alias-chip">${escapeHtml(name)}</span>`)
          .join("")}`;
        aliasEl.hidden = false;
      } else {
        aliasEl.innerHTML = "";
        aliasEl.hidden = true;
      }

      const profileLink = document.getElementById("ownerProfileLink");
      const profileUrl = safeMediaUrl(user.profile_url);
      if (profileUrl) {
        profileLink.href = profileUrl;
        profileLink.hidden = false;
      } else {
        profileLink.hidden = true;
      }
    }

    function renderCards() {
      const grid = document.getElementById("worksGrid");
      if (state.loading && !state.items.length) {
        grid.innerHTML = "";
        document.getElementById("worksEmpty").hidden = false;
        document.getElementById("worksEmpty").textContent = "正在加载作品…";
        document.getElementById("worksCount").textContent = "0";
        return;
      }
      grid.innerHTML = state.items.map((item, index) => renderCard(item, index)).join("");
      markPlayingCard();
      document.getElementById("worksCount").textContent = String(state.total);
      const empty = document.getElementById("worksEmpty");
      empty.textContent = "该用户还没有已下载的作品";
      empty.hidden = state.items.length > 0;
    }

    function renderPageNumbers() {
      const totalPages = Math.max(1, Number(state.totalPages || 1));
      if (totalPages <= 1) return "";
      const current = Math.min(Math.max(1, Number(state.page || 1)), totalPages);
      const start = Math.max(1, current - PAGE_NUMBER_WINDOW);
      const end = Math.min(totalPages, current + PAGE_NUMBER_WINDOW);
      const parts = [];
      if (start > 1) parts.push('<span class="page-ellipsis">…</span>');
      for (let page = start; page <= end; page += 1) {
        const active = page === current ? " active" : "";
        parts.push(
          `<button type="button" class="btn btn-secondary btn-sm page-num${active}" onclick="goToPage(${page})">${page}</button>`
        );
      }
      if (end < totalPages) parts.push('<span class="page-ellipsis">…</span>');
      return parts.join("");
    }

    function renderPagination() {
      const totalPages = Math.max(1, Number(state.totalPages || 1));
      const page = Math.min(Math.max(1, Number(state.page || 1)), totalPages);
      const atFirst = page <= 1;
      const atLast = page >= totalPages;

      document.getElementById("worksPaginationMeta").textContent = state.total
        ? `共 ${state.total} 个已下载作品 · 第 ${page} / ${totalPages} 页 · 每页 ${state.pageSize}`
        : "暂无已下载作品";
      document.getElementById("worksPageIndicator").innerHTML = renderPageNumbers();
      document.getElementById("worksFirstBtn").disabled = atFirst || state.loading;
      document.getElementById("worksPrevBtn").disabled = atFirst || state.loading;
      document.getElementById("worksNextBtn").disabled = atLast || state.loading;
      document.getElementById("worksLastBtn").disabled = atLast || state.loading;
      document.getElementById("worksPagination").hidden = !state.total && !state.loading;
    }

    function renderAll() {
      renderCards();
      renderPagination();
    }

    const PLAY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.4-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/></svg>';

    function formatSize(bytes) {
      const value = Number(bytes || 0);
      if (value <= 0) return "-";
      if (value >= 1024 * 1024 * 1024) return `${(value / 1024 / 1024 / 1024).toFixed(1)}GB`;
      if (value >= 1024 * 1024) return `${(value / 1024 / 1024).toFixed(1)}MB`;
      return `${Math.max(1, Math.round(value / 1024))}KB`;
    }

    function renderCard(item, index) {
      const isImage = String(item.media_type) === "image";
      const coverUrl = coverImageUrl(item);
      const coverHtml = coverUrl
        ? `<img src="${escapeHtml(coverUrl)}" alt="" loading="lazy" decoding="async" onerror="showCoverError(this)" />`
        : `<div class="work-cover-empty">${isImage ? "封面缺失" : "视频"}</div>`;

      const chips = [
        `<span class="work-chip">${isImage ? `图文 ${Number(item.image_count || 0)} 张` : "视频"}</span>`,
      ];

      const timeTag = isImage
        ? ""
        : `<div class="work-time-tag">${escapeHtml(formatDuration(item.duration_ms))}</div>`;
      const playHtml = isImage ? "" : `<div class="work-play">${PLAY_ICON}</div>`;
      const desc = String(item.desc || "").trim() || "（无描述）";

      return `
        <article class="work-card" data-index="${index}" title="${escapeHtml(desc)}">
          <div class="work-cover">
            ${coverHtml}
            ${playHtml}
            <div class="work-chips">${chips.join("")}</div>
            ${timeTag}
          </div>
          <div class="work-body">
            <div class="work-desc">${escapeHtml(desc)}</div>
            <div class="work-foot">
              <span>${escapeHtml(formatTime(item.publish_time, "时间未知"))}</span>
              <span>${escapeHtml(formatSize(item.total_size_bytes))}</span>
            </div>
          </div>
        </article>`;
    }

    function scrollContentToTop() {
      document.querySelector(".main-content")?.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showCoverError(image) {
      const message = document.createElement("div");
      message.className = "work-cover-empty";
      message.textContent = "封面加载失败";
      image.replaceWith(message);
    }

    async function loadPage(page) {
      if (state.loading) return;
      state.loading = true;
      renderPagination();
      if (!state.items.length) renderCards();
      try {
        const query = new URLSearchParams({
          page: String(Math.max(1, Number(page) || 1)),
          page_size: String(state.pageSize),
        });
        const data = await api(`/users/${encodeURIComponent(USER_ID)}/archive?${query.toString()}`);
        renderOwner(data.user);
        state.items = Array.isArray(data.items) ? data.items : [];
        state.page = Number(data.page || 1);
        state.pageSize = Number(data.page_size || state.pageSize);
        state.total = Number(data.total || 0);
        state.totalPages = Number(data.total_pages || 1);
        state.mediaCounts = data.media_counts || {};
        state.archiveEnabled = data.archive_enabled !== false;
        syncViewerIndex();
        prefetchDirectUrls();
      } catch (error) {
        showToast(error.message || "加载作品失败", "error");
      } finally {
        state.loading = false;
        renderAll();
      }
    }

    function goToPage(page) {
      if (state.loading) return;
      const target = Math.min(Math.max(1, Number(page) || 1), Math.max(1, Number(state.totalPages || 1)));
      if (target === state.page) return;
      loadPage(target);
      scrollContentToTop();
    }

    function onPageSizeChange() {
      const el = document.getElementById("worksPageSize");
      state.pageSize = Number(el?.value || 20);
      loadPage(1);
    }

    function reloadWorks() {
      if (state.loading) return false;
      loadPage(state.page);
      return false;
    }

    function openViewer(index, options = {}) {
      const item = state.items[index];
      if (!item) return;
      state.viewerOpen = true;
      state.viewerItem = item;
      state.viewerIndex = index;
      state.imageIndex = 0;

      document.getElementById("viewerTitle").textContent = String(item.desc || "").trim() || item.aweme_id;
      document.getElementById("viewerTitle").title = String(item.desc || "").trim();
      const shareLink = document.getElementById("viewerShareLink");
      const shareUrl = safeMediaUrl(item.share_url);
      shareLink.href = shareUrl || "#";
      shareLink.hidden = !shareUrl;
      const originalLink = document.getElementById("viewerOriginalLink");
      const hasOriginal = item.media_type === "video" && item.archive_index !== null && item.archive_index !== undefined;
      originalLink.hidden = !hasOriginal;
      if (hasOriginal) originalLink.href = archiveMediaUrl(item.aweme_id, item.archive_index);
      else originalLink.removeAttribute("href");

      document.getElementById("viewer").classList.add("show");
      renderStage();
      // 服务端缓存预取只对走代理的视频有用：视频等出画面再决定（见 onVideoReady）；
      // 图文作品只在视频直链停用时才替相邻视频预取
      if (!document.querySelector("#viewerStage video") && state.directDisabled) prefetchNeighbors();
      updateWorkNav();
      markPlayingCard(options.scroll);
    }

    // 当前页里定位正在播的作品；换页/改每页条数后它可能已不在本页
    function syncViewerIndex() {
      if (!state.viewerOpen || !state.viewerItem) return;
      const awemeId = state.viewerItem.aweme_id;
      state.viewerIndex = state.items.findIndex((item) => item.aweme_id === awemeId);
      updateWorkNav();
    }

    function markPlayingCard(scroll = false) {
      document.querySelectorAll(".work-card.playing").forEach((card) => card.classList.remove("playing"));
      if (!state.viewerOpen || state.viewerIndex < 0) return;
      const card = document.querySelector(`.work-card[data-index="${state.viewerIndex}"]`);
      if (!card) return;
      card.classList.add("playing");
      if (scroll) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function hasAdjacentWork(delta) {
      const idx = state.viewerIndex;
      const onPage = delta > 0 ? idx >= 0 && idx < state.items.length - 1 : idx > 0;
      const fromOffPage = idx < 0 && state.items.length > 0;
      const crossPage = delta > 0 ? state.page < state.totalPages : state.page > 1;
      return onPage || fromOffPage || crossPage;
    }

    function updateWorkNav() {
      if (!state.viewerOpen) return;
      document.getElementById("viewerPrevWork").disabled = state.viewerBusy || !hasAdjacentWork(-1);
      document.getElementById("viewerNextWork").disabled = state.viewerBusy || !hasAdjacentWork(1);
      const counter = document.getElementById("viewerCounter");
      counter.textContent = state.viewerIndex >= 0 && state.total
        ? `${(state.page - 1) * state.pageSize + state.viewerIndex + 1} / ${state.total}`
        : "";
    }

    // 上/下一个作品；到本页边界时自动翻页，接着播相邻页的首/尾
    async function stepWork(delta) {
      if (!state.viewerOpen || state.viewerBusy || !hasAdjacentWork(delta)) return;
      const idx = state.viewerIndex;
      const target = idx < 0 ? (delta > 0 ? 0 : state.items.length - 1) : idx + delta;
      if (target >= 0 && target < state.items.length) {
        openViewer(target, { scroll: true });
        return;
      }
      const page = state.page + (delta > 0 ? 1 : -1);
      state.viewerBusy = true;
      updateWorkNav();
      try {
        await loadPage(page);
      } finally {
        state.viewerBusy = false;
      }
      // 翻页失败（loadPage 已 toast）就留在当前作品
      if (!state.viewerOpen || state.page !== page || !state.items.length) {
        updateWorkNav();
        return;
      }
      openViewer(delta > 0 ? 0 : state.items.length - 1, { scroll: true });
    }

    function renderStage() {
      const item = state.viewerItem;
      const stage = document.getElementById("viewerStage");
      const meta = document.getElementById("viewerMeta");
      if (!item) return;
      stopViewerMedia();

      if (String(item.media_type) === "image") {
        // 服务端已排除单独存的封面，只展示内容图片。
        const indices = Array.isArray(item.image_indices) ? item.image_indices : [];
        const urls = indices.map((i) => archiveMediaUrl(item.aweme_id, i));
        if (!urls.length) {
          sizeStage(9, 16);
          stage.innerHTML = '<div class="empty-state">该图文没有已归档的图片</div>';
          meta.textContent = "图文 · 0 张";
          return;
        }
        const clamped = Math.min(Math.max(state.imageIndex, 0), urls.length - 1);
        state.imageIndex = clamped;
        const pagerHtml = urls.length > 1
          ? `<div class="viewer-pager">
               <button type="button" class="viewer-nav" onclick="stepImage(-1)" aria-label="上一张"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg></button>
               <span>${clamped + 1} / ${urls.length}</span>
               <button type="button" class="viewer-nav" onclick="stepImage(1)" aria-label="下一张"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg></button>
             </div>`
          : "";
        // 图片尺寸未知：先沿用上一次的比例，加载后再贴合，避免翻页时窗口来回跳
        sizeStage(state.viewerRatio, 1);
        meta.textContent = `图文 · 第 ${clamped + 1} / ${urls.length} 张`;
        const entry = freshDirectEntry(item.aweme_id);
        if (entry === undefined) {
          // 先取直链（单条约 1 秒）；经代理冷读一张图要 3~5 秒
          stage.innerHTML = `<div class="viewer-loading">正在获取图片地址…</div>${pagerHtml}`;
          const imageIndex = clamped;
          getDirectEntry(item.aweme_id).then(() => {
            if (state.viewerItem === item && state.imageIndex === imageIndex) renderStage();
          });
          return;
        }
        const direct = entry?.images?.[clamped] || null;
        const mode = direct ? "direct" : "proxy";
        stage.innerHTML = `<div class="viewer-loading">图片加载中…</div>`
          + `<img src="${escapeHtml(direct || urls[clamped])}" alt="" data-mode="${mode}" data-proxy="${escapeHtml(urls[clamped])}"`
          + ` onload="onImageReady(this)" onerror="onImageError(this)" />${pagerHtml}`;
        meta.textContent += ` · ${mode === "direct" ? "直连" : "代理"}`;
        // 预载下一张，翻页时直接出图（直链没有就不预载，免得给代理加负担）
        const nextDirect = entry?.images?.[clamped + 1];
        if (nextDirect) new Image().src = nextDirect;
        return;
      }

      const source = item.has_fast_play ? item.fast_play_source : item.video_source;
      // 先用记录里的分辨率定尺寸，metadata 到了再以真实宽高（含旋转）校正
      sizeStage(Number(source?.width || 9), Number(source?.height || 16));
      if (item.play_index === null || item.play_index === undefined) {
        stage.innerHTML = '<div class="empty-state">该视频没有可播放文件</div>';
        meta.textContent = "视频 · 无可播放文件";
        return;
      }
      const coverUrl = coverImageUrl(item);
      const poster = coverUrl ? ` poster="${escapeHtml(coverUrl)}"` : "";
      stage.innerHTML = `<video controls autoplay playsinline preload="metadata"${poster} onloadedmetadata="sizeStage(this.videoWidth, this.videoHeight)" onloadeddata="onVideoReady(this)" onerror="onVideoError(this)"></video>`;
      const video = stage.querySelector("video");
      const direct = state.directDisabled ? null : freshDirectUrl(item.aweme_id);
      if (direct !== undefined) {
        // 直链已就绪（列表加载时批量取好）或已知只能代理：同步设 src，保住点击手势的自动播放
        setVideoSource(video, item, direct);
        return;
      }
      setVideoMeta(item, "正在获取播放地址…");
      getDirectUrl(item.aweme_id).then((url) => {
        // 等待期间用户可能已切走
        if (state.viewerItem !== item || !video.isConnected) return;
        setVideoSource(video, item, url);
        video.play().catch(() => {});  // 异步设 src 后自动播放可能被拦，用户点播放即可
      });
    }

    // direct 为 null 时走服务端代理：源站在国内、本服务在美国，冷启动慢，只作兜底
    function setVideoSource(video, item, direct, note = "") {
      const mode = direct ? "direct" : "proxy";
      video.dataset.mode = mode;
      video.src = direct || archiveMediaUrl(item.aweme_id, item.play_index);
      setVideoMeta(item, note || (mode === "direct" ? "直连" : "代理"));
    }

    function setVideoMeta(item, modeLabel) {
      const source = item.has_fast_play ? item.fast_play_source : item.video_source;
      const quality = source && source.height ? ` · ${source.width}x${source.height}` : "";
      const label = item.has_fast_play ? "流畅播放" : "原片";
      document.getElementById("viewerMeta").textContent =
        `视频 · ${label}${quality} · ${formatDuration(item.duration_ms)} · ${modeLabel}`;
    }

    function onVideoReady(video) {
      if (video.dataset.mode === "direct") {
        state.directFailures = 0;
        return;
      }
      // 代理模式下当前视频出画面后再预取相邻作品，不和它抢首屏回源
      prefetchNeighbors();
    }

    function onVideoError(video) {
      const item = state.viewerItem;
      if (!item || video.dataset.mode !== "direct") {
        showVideoError();
        prefetchNeighbors();
        return;
      }
      // 直链失败（过期/被拒/浏览器不认）：丢掉这条，改走代理重播；连续失败就本次会话不再用直链
      state.directUrls.delete(item.aweme_id);
      state.directFailures += 1;
      if (state.directFailures >= DIRECT_FAILURE_LIMIT) state.directDisabled = true;
      console.warn("直链播放失败，改走代理", item.aweme_id, video.error, { directDisabled: state.directDisabled });
      setVideoSource(video, item, null, state.directDisabled ? "代理（直连连续失败，已停用）" : "代理（直连失败）");
      video.play().catch(() => {});
    }

    const DIRECT_FAILURE_LIMIT = 2;
    // 过期前留 1 分钟余量，避免拿到临界直链
    const DIRECT_URL_REFRESH_MARGIN_MS = 60 * 1000;

    // 直链接口整体失败时，这段时间内相关作品直接走代理，避免每次点开都先白等一次
    const DIRECT_URL_FAILURE_BACKOFF_MS = 60 * 1000;

    // 返回 { url, images } 或 undefined（没取过或已过期）。url/images 里的 null 表示该文件只能走代理
    function freshDirectEntry(awemeId) {
      const entry = state.directUrls.get(awemeId);
      if (!entry || Date.now() >= entry.expiresAt - DIRECT_URL_REFRESH_MARGIN_MS) return undefined;
      return entry;
    }

    // 视频直链：字符串=可用；null=只能走代理；undefined=还不知道
    function freshDirectUrl(awemeId) {
      const entry = freshDirectEntry(awemeId);
      return entry === undefined ? undefined : entry.url;
    }

    function fetchDirectUrls(awemeIds) {
      const pending = api(`/users/${encodeURIComponent(USER_ID)}/archive/playback-urls`, {
        method: "POST",
        body: JSON.stringify({ aweme_ids: awemeIds }),
      }).then((data) => {
        const expiresAt = Date.now() + Number(data.ttl_seconds || 0) * 1000;
        for (const [awemeId, url] of Object.entries(data.urls || {})) {
          state.directUrls.set(awemeId, { url: safeMediaUrl(url) || null, images: null, expiresAt });
        }
        for (const [awemeId, images] of Object.entries(data.image_urls || {})) {
          const list = (Array.isArray(images) ? images : []).map((url) => safeMediaUrl(url) || null);
          state.directUrls.set(awemeId, { url: null, images: list, expiresAt });
        }
        const errors = data.errors || {};
        // 解析失败的作品这段时间内直接走代理（代理自己会再试主力盘/备份盘）
        for (const awemeId of Object.keys(errors)) state.directUrls.set(awemeId, { url: null, images: null, expiresAt });
        if (Object.keys(errors).length) console.warn("部分作品直链解析失败，改走代理", errors);
      }).catch((error) => {
        console.warn("获取直链失败，改走代理", error);
        const expiresAt = Date.now() + DIRECT_URL_REFRESH_MARGIN_MS + DIRECT_URL_FAILURE_BACKOFF_MS;
        awemeIds.forEach((awemeId) => state.directUrls.set(awemeId, { url: null, images: null, expiresAt }));
      }).finally(() => {
        awemeIds.forEach((awemeId) => {
          if (state.directPending.get(awemeId) === pending) state.directPending.delete(awemeId);
        });
      });
      pending.batchSize = awemeIds.length;
      awemeIds.forEach((awemeId) => state.directPending.set(awemeId, pending));
      return pending;
    }

    async function getDirectEntry(awemeId) {
      if (freshDirectEntry(awemeId) === undefined) {
        // 整页批量要等最慢的那条，点开的这条单独取更快；单条请求已在路上就复用
        const pending = state.directPending.get(awemeId);
        await (pending && pending.batchSize === 1 ? pending : fetchDirectUrls([awemeId]));
      }
      return freshDirectEntry(awemeId) ?? null;
    }

    async function getDirectUrl(awemeId) {
      return (await getDirectEntry(awemeId))?.url ?? null;
    }

    function onImageReady(image) {
      image.parentElement?.querySelector(".viewer-loading")?.remove();
      sizeStage(image.naturalWidth, image.naturalHeight);
    }

    function onImageError(image) {
      if (image.dataset.mode === "direct") {
        // 直链失败（过期/被拒）：这张改走代理，作品的直链作废，下次重取
        console.warn("图片直链加载失败，改走代理", state.viewerItem?.aweme_id);
        if (state.viewerItem) state.directUrls.delete(state.viewerItem.aweme_id);
        image.dataset.mode = "proxy";
        image.src = image.dataset.proxy;
        const meta = document.getElementById("viewerMeta");
        meta.textContent = meta.textContent.replace(/直连$/, "代理（直连失败）");
        return;
      }
      const loading = image.parentElement?.querySelector(".viewer-loading");
      if (loading) loading.textContent = "图片加载失败，请重新打开重试";
      document.getElementById("viewerMeta").textContent = "图片加载失败，请重新打开重试";
    }

    // 列表加载后批量取本页视频直链，点开时通常已就绪
    function prefetchDirectUrls() {
      // 视频直链被本会话停用时，图文照样直连（<img> 不挑 Content-Type）
      const ids = state.items
        .filter((item) => item.media_type === "image"
          ? (item.image_indices || []).length > 0
          : !state.directDisabled && item.play_index !== null && item.play_index !== undefined)
        .map((item) => item.aweme_id)
        .filter((awemeId) => freshDirectEntry(awemeId) === undefined && !state.directPending.has(awemeId));
      if (ids.length) fetchDirectUrls(ids);
    }

    // 服务端按列表顺序（跨分页）把后 2 个、前 1 个作品的播放文件拉进本机缓存，
    // 点上/下一个时直接本机应答。只是加速手段，失败不打扰用户。
    let lastPrefetchedAwemeId = "";
    function prefetchNeighbors() {
      const awemeId = state.viewerItem?.aweme_id;
      if (!awemeId || awemeId === lastPrefetchedAwemeId) return;
      lastPrefetchedAwemeId = awemeId;
      api(`/users/${encodeURIComponent(USER_ID)}/archive/${encodeURIComponent(awemeId)}/prefetch`, { method: "POST" })
        .catch((error) => console.warn("相邻作品预取失败", awemeId, error));
    }

    function stepImage(delta) {
      if (state.viewerItem?.media_type !== "image") return;
      state.imageIndex += Number(delta || 0);
      renderStage();
    }

    function showVideoError() {
      document.getElementById("viewerMeta").textContent = "视频加载失败，请重新打开重试";
    }

    const VIEWER_MARGIN = 16;
    // 标题栏 + 底栏的大致高度，给画面留出空间
    const VIEWER_CHROME_HEIGHT = 96;

    function isCompactViewer() { return window.innerWidth <= 640; }

    // 按宽高比在视口内取最大尺寸：竖屏视频不再被塞进 16:9 黑框
    function sizeStage(width, height) {
      const w = Number(width);
      const h = Number(height);
      if (w > 0 && h > 0) state.viewerRatio = w / h;
      const ratio = state.viewerRatio;
      const stage = document.getElementById("viewerStage");
      const compact = isCompactViewer();
      const maxW = compact ? window.innerWidth - 26 : Math.min(window.innerWidth - VIEWER_MARGIN * 2 - 2, 760);
      const maxH = Math.max(180, compact
        ? window.innerHeight * 0.62
        : Math.min(window.innerHeight - VIEWER_MARGIN * 2 - VIEWER_CHROME_HEIGHT, 720));
      let stageW = maxH * ratio;
      let stageH = maxH;
      if (stageW > maxW) { stageW = maxW; stageH = maxW / ratio; }
      // 太窄时标题栏挤不下，宽度兜底，画面 contain 留黑边
      stageW = Math.min(maxW, Math.max(stageW, 320));
      stage.style.width = `${Math.round(stageW)}px`;
      stage.style.height = `${Math.round(compact ? Math.min(stageH, maxW / ratio) : stageH)}px`;
      // 窗口宽度跟随画面，不让长标题/底栏把窗口撑宽（+2 为边框）
      document.getElementById("viewer").style.width = compact ? "" : `${Math.round(stageW) + 2}px`;
      clampViewerPosition();
    }

    function applyViewerPosition() {
      const viewer = document.getElementById("viewer");
      if (!state.viewerPos || isCompactViewer()) {
        viewer.style.left = viewer.style.top = "";
        viewer.style.right = viewer.style.bottom = "";
        return;
      }
      viewer.style.left = `${state.viewerPos.x}px`;
      viewer.style.top = `${state.viewerPos.y}px`;
      viewer.style.right = viewer.style.bottom = "auto";
    }

    // 拖过的窗口在尺寸变化/视口缩放后仍要留在屏幕内
    function clampViewerPosition() {
      if (!state.viewerPos) { applyViewerPosition(); return; }
      const viewer = document.getElementById("viewer");
      const maxX = Math.max(VIEWER_MARGIN, window.innerWidth - viewer.offsetWidth - VIEWER_MARGIN);
      const maxY = Math.max(VIEWER_MARGIN, window.innerHeight - viewer.offsetHeight - VIEWER_MARGIN);
      state.viewerPos = {
        x: Math.min(Math.max(state.viewerPos.x, VIEWER_MARGIN), maxX),
        y: Math.min(Math.max(state.viewerPos.y, VIEWER_MARGIN), maxY),
      };
      applyViewerPosition();
    }

    function initViewerDrag() {
      const viewer = document.getElementById("viewer");
      const head = document.getElementById("viewerHead");
      let drag = null;
      head.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || isCompactViewer() || event.target.closest("button")) return;
        const rect = viewer.getBoundingClientRect();
        drag = { id: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
        head.setPointerCapture(event.pointerId);
        viewer.classList.add("dragging");
      });
      head.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.id) return;
        state.viewerPos = { x: event.clientX - drag.dx, y: event.clientY - drag.dy };
        clampViewerPosition();
      });
      const endDrag = (event) => {
        if (!drag || event.pointerId !== drag.id) return;
        drag = null;
        viewer.classList.remove("dragging");
      };
      head.addEventListener("pointerup", endDrag);
      head.addEventListener("pointercancel", endDrag);
    }

    function stopViewerMedia() {
      const video = document.querySelector("#viewerStage video");
      if (!video) return;
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function closeViewer() {
      const stage = document.getElementById("viewerStage");
      stopViewerMedia();
      stage.innerHTML = "";
      state.viewerOpen = false;
      state.viewerItem = null;
      state.viewerIndex = -1;
      document.getElementById("viewer").classList.remove("show");
      markPlayingCard();
    }

    document.addEventListener("keydown", (event) => {
      if (!state.viewerOpen) {
        // 没开预览时，Esc 用来关掉外层浮层（焦点在 iframe 内，父页收不到按键）
        if (event.key === "Escape") requestOverlayClose();
        return;
      }
      if (event.target.closest?.("input, select, textarea")) return;
      if (event.key === "Escape") closeViewer();
      else if (event.key === "ArrowLeft") stepImage(-1);
      else if (event.key === "ArrowRight") stepImage(1);
      else if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        stepWork(event.key === "ArrowDown" ? 1 : -1);
      }
    });

    window.addEventListener("resize", () => {
      if (state.viewerOpen) sizeStage(state.viewerRatio, 1);
    });

    document.getElementById("worksGrid").addEventListener("click", (event) => {
      const card = event.target.closest(".work-card");
      if (!card) return;
      openViewer(Number(card.dataset.index));
    });

    function init() {
      initViewerDrag();
      if (!USER_ID) {
        document.getElementById("ownerName").textContent = "缺少 user_id";
        document.getElementById("worksHint").textContent = "请从用户列表点击头像进入";
        document.getElementById("worksEmpty").hidden = false;
        renderAll();
        return;
      }
      loadPage(1);
    }

    init();
  </script>
</body>
</html>
