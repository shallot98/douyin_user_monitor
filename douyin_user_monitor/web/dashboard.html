  <style>
    /* page-only: keep thin */
    .header-actions-cluster { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stat-card .stat-value { font-size: 24px; }
    #metric-mode-name, #metric-health, #metric-cookie-status { font-size: 18px; }
    .dashboard-grid { grid-template-columns: 1fr; }

    .card-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 16px;
    }
    .secondary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 16px;
    }
    .stacked-bar {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
      display: flex;
      margin-bottom: 14px;
    }
    .stacked-segment.video { background: linear-gradient(90deg, var(--primary) 0%, var(--primary) 100%); }
    .stacked-segment.image { background: linear-gradient(90deg, #ec4899 0%, #f472b6 100%); }
    .stacked-segment.empty { background: linear-gradient(90deg, #cbd5e1 0%, var(--text-lighter) 100%); }
    .legend-list { display: flex; flex-direction: column; gap: 12px; }
    .legend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-weight: 600;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-value { color: var(--text-muted); font-size: 12px; }
    .note-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px dashed var(--border-strong);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .insight-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .insight-card {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-elevated) 100%);
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .insight-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    .insight-card h4 {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .insight-card strong {
      display: block;
      font-size: 20px;
      font-weight: 780;
      letter-spacing: -0.4px;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .insight-card p {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
      margin: 0;
    }
    @media (max-width: 900px) {
      .analytics-grid { grid-template-columns: 1fr; }
      .insight-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .insight-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">内容结构总览</div>
                <div class="card-subtitle">当前结构分析覆盖率与视频 / 图集构成</div>
              </div>
            </div>
            <div class="card-body">
              <div class="stacked-bar">
                <div id="videoSegment" class="stacked-segment video" style="width:0%;"></div>
                <div id="imageSegment" class="stacked-segment image" style="width:0%;"></div>
                <div id="emptySegment" class="stacked-segment empty" style="width:100%;"></div>

              <div class="legend-list">
                <div class="legend-item">
                  <div class="legend-left"><span class="legend-dot" style="background:var(--primary);"></span>已归档视频</div>
                  <div class="legend-value" id="legendVideos">-</div>
                </div>
                <div class="legend-item">
                  <div class="legend-left"><span class="legend-dot" style="background:#ec4899;"></span>已归档图集</div>
                  <div class="legend-value" id="legendImages">-</div>
                </div>
                <div class="legend-item">
                  <div class="legend-left"><span class="legend-dot" style="background:#94a3b8;"></span>未覆盖作品</div>
                  <div class="legend-value" id="legendUncovered">-</div>
                </div>
              </div>
              <div class="note-box" id="coverageNote">正在计算覆盖说明…</div>
            </div>
          </div>

            <div class="card-header">
              <div>
                <div class="card-title">活跃与风险洞察</div>
                <div class="card-subtitle">点击卡片可前往用户统计页查看/筛选</div>

            </div>
            <div class="card-body">
              <div class="insight-grid">
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计">
                  <h4>近 7 天活跃</h4>
                  <strong id="activeUsers7d">-</strong>
                  <p>一周内有发布时间记录</p>
                </button>
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计">
                  <h4>近 30 天活跃</h4>
                  <strong id="activeUsers30d">-</strong>
                  <p>一个月仍有发布时间记录</p>
                </button>
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计 · 可筛沉默">
                  <h4>沉默 7 天</h4>
                  <strong id="silentUsers7dCount">-</strong>
                  <p>超过 7 天无发布</p>
                </button>
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计 · 可筛沉默 30d">
                  <h4>沉默 30 天</h4>
                  <strong id="silentUsers30dCount">-</strong>
                  <p>超过 30 天无发布</p>
                </button>
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计 · 可筛异常">
                  <h4>异常账号</h4>
                  <strong id="deactivatedUsersCount">-</strong>
                  <p>注销 / 封禁</p>
                </button>
                <button type="button" class="insight-card" onclick="goStatistics()" title="前往用户统计 · 可筛未知发布">
                  <h4>未知发布时间</h4>
                  <strong id="unknownUsersCount">-</strong>
                  <p>无法判断活跃度</p>
                </button>
              </div>
            </div>
          </div>
        </section>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">下载动态</h2>
              <span id="recordsTotal" class="pill-count">0 条</span>
            </div>
            <div class="card-body" style="padding:0;">
              <div id="globalRecords" class="activity-feed">
                <div class="empty-state">暂无下载记录</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
<div id="sidebarOverlay" class="overlay" onclick="toggleSidebar()"></div>
  <div id="toast-container" class="toast-container"></div>

<script src="/static/common.js?v=live-20260929a"></script>
  <script>
    const Icons = {
      video: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>`,
      photo: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>`,
      checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`,
      exclamation: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" /></svg>`,
    };

    // toggleSidebar / closeSidebarMobile / navigateToPage 及 resize 监听见 common.js；
    // isMobileViewport 各页断点不同（本页 1024），保留在本页由 common.js 在调用时引用。
    function isMobileViewport() {
      return window.matchMedia("(max-width: 1024px)").matches;
    }

    // 时间格式化（SHANGHAI_TIME_FORMATTER / formatTime / parseTimeToMillis 等）见 common.js。

    let refreshSeq = 0;
    // API_BASE 见 common.js。

    function showToast(message, type = 'success') {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<div style="color: ${type==='success'?'var(--success)':'var(--danger)'}">${type === 'success' ? Icons.checkCircle : Icons.exclamation}</div><div style="font-size:14px; font-weight:500;">${message}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('show'); }); });
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // api() 见 common.js。

    function goStatistics() {
      return navigateToPage('/api/monitor/statistics/dashboard');
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function formatPercent(value) {
      return `${Number(value || 0).toFixed(1)}%`;
    }

    function formatBytes(bytes) {
      const size = Number(bytes || 0);
      if (size <= 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let value = size;
      let unitIndex = 0;
      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }
      const digits = value >= 100 || unitIndex === 0 ? 0 : 1;
      return `${value.toFixed(digits)} ${units[unitIndex]}`;
    }

    function onModeChanged() {
      // 调度配置已迁到独立设置页；主页仅展示状态。
    }

    function renderStatus(status, summary) {
      summary = summary || {};
      const usersCount = Number(summary.total_users || 0);
      const totalDownloaded = Number(summary.total_downloaded_works || 0);
      const mode = status.mode || "interval";
      const dot = document.getElementById("runStateDot");
      const text = document.getElementById("runStateText");

      if (status.is_running) {
        dot.classList.add("running"); text.textContent = "运行中";
        document.getElementById("btnStart").style.display = "none"; document.getElementById("btnStop").style.display = "inline-flex";
        document.getElementById("metric-health").textContent = "正在后台轮询";
        document.getElementById("metric-health").style.color = "var(--success)";
      } else {
        dot.classList.remove("running"); text.textContent = "已停止";
        document.getElementById("btnStart").style.display = "inline-flex"; document.getElementById("btnStop").style.display = "none";
        document.getElementById("metric-health").textContent = "服务已暂停";
        document.getElementById("metric-health").style.color = "var(--text-muted)";
      }

      document.getElementById("metric-mode-name").textContent = mode === "coverage" ? "Coverage" : "Interval";
      document.getElementById("metric-mode-desc").textContent = (mode === "coverage" ? `${Number(status.coverage_hours || 0)}h/覆盖` : `${Number(status.interval_hours || 0)}h/间隔`);

      document.getElementById("metric-users").textContent = String(usersCount);
      const cycleDownloads = Number((status.last_run_result || {}).downloaded_items || 0);
      document.getElementById("metric-downloads").textContent = String(cycleDownloads);
      const hint = document.getElementById("metric-downloads-hint");
      if (hint) {
        hint.textContent = `累计下载作品 ${totalDownloaded}（本轮 ${cycleDownloads}）`;
      }

      const live = status.cookie_liveness || {};
      const cookieStatus = String(live.status || "").trim() || "未检测";
      const cookieEl = document.getElementById("metric-cookie-status");
      const cookieDetail = document.getElementById("metric-cookie-detail");
      if (cookieEl) {
        cookieEl.textContent = cookieStatus;
        const colorMap = {
          healthy: "var(--success)",
          degraded: "#b45309",
          expired: "var(--danger)",
          unknown: "var(--text-muted)",
        };
        cookieEl.style.color = colorMap[cookieStatus] || "var(--text-muted)";
      }
      if (cookieDetail) {
        const signal = live.signal ? `信号 ${live.signal}` : "无信号";
        const samples = live.samples_used != null ? `样本 ${live.samples_used}` : "";
        const fresh = live.fresh_count != null ? `fresh ${live.fresh_count}` : "";
        const reason = live.reason ? String(live.reason) : "";
        cookieDetail.textContent = [signal, samples, fresh].filter(Boolean).join(" · ") + (reason ? ` · ${reason}` : "");
      }

      // 调度表单已从主页移除，模式/间隔仅通过指标卡片展示。
    }

    function renderCoverage(summary) {
      summary = summary || {};
      const structured = Number(summary.structured_work_count || 0);
      const uncovered = Math.max(0, Number(summary.total_downloaded_works || 0) - structured);
      const videos = Number(summary.known_video_posts || 0);
      const images = Number(summary.known_image_posts || 0);
      const base = Math.max(1, videos + images + uncovered);
      const videoPercent = (videos / base) * 100;
      const imagePercent = (images / base) * 100;
      const uncoveredPercent = Math.max(0, 100 - videoPercent - imagePercent);

      document.getElementById("videoSegment").style.width = `${videoPercent}%`;
      document.getElementById("imageSegment").style.width = `${imagePercent}%`;
      document.getElementById("emptySegment").style.width = `${uncoveredPercent}%`;
      document.getElementById("legendVideos").textContent = `${formatNumber(videos)} 条`;
      document.getElementById("legendImages").textContent =
        `${formatNumber(images)} 条图集 / ${formatNumber(summary.known_image_assets)} 张图`;
      document.getElementById("legendUncovered").textContent = `${formatNumber(uncovered)} 条`;
      document.getElementById("coverageNote").innerHTML = `
        <div><strong style="color:var(--text-main);">结构覆盖率：</strong>${formatPercent(summary.structured_coverage_percent)}</div>
        <div>说明：累计作品数使用总下载计数；视频 / 图集拆分使用本地保存的 <code>download_records</code>。当前已归档体量约 <strong>${formatBytes(summary.structured_total_size_bytes)}</strong>。</div>
      `;
    }

    function renderActivityInsights(summary) {
      summary = summary || {};
      document.getElementById("activeUsers7d").textContent = formatNumber(summary.active_users_7d);
      document.getElementById("activeUsers30d").textContent = formatNumber(summary.active_users_30d);
      document.getElementById("silentUsers7dCount").textContent = formatNumber(summary.silent_users_7d);
      document.getElementById("silentUsers30dCount").textContent = formatNumber(summary.silent_users_30d);
      document.getElementById("unknownUsersCount").textContent = formatNumber(summary.unknown_publish_users);
      document.getElementById("deactivatedUsersCount").textContent = formatNumber(summary.abnormal_users);
    }

    function renderGlobalRecords(recentActivity) {
      const topRecords = Array.isArray(recentActivity) ? recentActivity.slice(0, 50) : [];
      document.getElementById("recordsTotal").textContent = `${topRecords.length} 条`;

      const root = document.getElementById("globalRecords");
      if (!topRecords.length) { root.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">暂无下载记录</div>'; return; }

      root.innerHTML = topRecords.map(record => {
        const isVideo = record.media_type === "video";
        let metaText = isVideo ? "视频" : "图文";
        if (!isVideo && record.image_count) metaText += ` (${record.image_count}张)`;
        return `
          <div class="feed-item">
            <div class="feed-icon ${isVideo ? 'video' : 'photo'}">${isVideo ? Icons.video : Icons.photo}</div>
            <div class="feed-content">
              <div class="feed-header"><span class="feed-user">${record.user_nickname || "-"}</span><span class="feed-time">${formatTime(record.downloaded_at)}</span></div>
              <div class="feed-desc">[${metaText}] 新增 ${Number(record.downloaded_file_count || 0)} 个文件</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function refreshAll() {
      const seq = ++refreshSeq;
      try {
        const [status, statistics, activityResp] = await Promise.all([
          api("/status"),
          api("/statistics"),
          api("/recent_activity"),
        ]);
        // 丢弃过期请求，避免快速连续刷新时旧数据回写覆盖当前视图
        if (seq !== refreshSeq) return;
        const summary = statistics.summary || {};
        renderStatus(status, summary);
        renderCoverage(summary);
        renderActivityInsights(summary);
        renderGlobalRecords(activityResp.recent_activity || []);
      } catch (err) {
        if (seq !== refreshSeq) return;
        showToast(err.message, 'error');
      }
    }

    async function startMonitor() {
      try {
        // 主页启动沿用当前后端状态里的 mode/interval/coverage，不再从表单读取。
        const status = await api("/status");
        const body = {
          mode: status.mode || "interval",
          interval_hours: Number(status.interval_hours ?? 0.05),
          coverage_hours: Number(status.coverage_hours ?? 24),
        };
        await api("/start", { method: "POST", body: JSON.stringify(body) });
        showToast("已启动后台监控"); await refreshAll();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function stopMonitor() {
      try { await api("/stop", { method: "POST" }); showToast("已停止"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function runOnce() {
      try { showToast("开始全局检查..."); const res = await api("/run_once", { method: "POST" }); showToast(`检查 ${res.checked_users || 0} 人, 下载 ${res.downloaded_items || 0} 个作品`); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    refreshAll();
    startLiveRefresh(refreshAll);
  </script>

</body>
</html>
