    // toggleSidebar / closeSidebarMobile / navigateToPage 及 resize 监听见 common.js；
    // isMobileViewport 各页断点不同（本页 1024），保留在本页由 common.js 在调用时引用。
    function isMobileViewport() {
      return window.matchMedia("(max-width: 1024px)").matches;
    }

    function toggleGlobalUserList() {
      isGlobalUserListExpanded = !isGlobalUserListExpanded;
      renderUsers(cachedUsers);
    }

    function getUserSearchKeyword() {
      return userSearchKeyword.trim().toLowerCase();
    }

    function handleUserSearch() {
      const input = document.getElementById("userSearchInput");
      userSearchKeyword = String(input?.value || "");
      renderUsers(cachedUsers);
    }

    function filterUsers(users) {
      const keyword = getUserSearchKeyword();
      if (!keyword) return users;
      return users.filter(user => [user.nickname, user.sec_user_id, user.id, user.profile_url]
        .some(value => String(value || "").toLowerCase().includes(keyword)));
    }

    function buildUserEmptyState(totalUsers, filteredUsers) {
      if (!totalUsers) return '暂无监控用户';
      if (getUserSearchKeyword() && !filteredUsers) {
        return `未找到匹配“${escapeHtml(userSearchKeyword.trim())}”的监控用户`;
      }
      return '暂无监控用户';
    }

    // 时间格式化（SHANGHAI_TIME_FORMATTER / formatTime / parseTimeToMillis 等）见 common.js。
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // jsAttr（onclick 内联事件安全转义）见 common.js。
    function renderUserAvatar(user) {
      const initial = escapeHtml((user.nickname || user.sec_user_id || "?").charAt(0).toUpperCase());
      const avatarUrl = String(user.avatar_url || "").trim();
      if (!avatarUrl) return `<div class="user-avatar">${initial}</div>`;
      const userId = encodeURIComponent(String(user.id || "").trim());
      if (!userId) return `<div class="user-avatar">${initial}</div>`;
      const version = encodeURIComponent(String(user.updated_at || avatarUrl));
      const safeUrl = `${API_BASE}/users/${userId}/avatar?v=${version}`;
      return `<div class="user-avatar"><img src="${safeUrl}" alt="${initial}" loading="lazy" onerror="this.remove();this.parentElement.textContent=this.alt;" /></div>`;
    }

    let refreshSeq = 0;
    // API_BASE 见 common.js。

    function showToast(message, type = 'success') {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<div style="color: ${type==='success'?'var(--success)':'var(--danger)'}">${type === 'success' ? Icons.checkCircle : Icons.exclamation}</div><div style="font-size:14px; font-weight:500;">${message}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('show'); }); });
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // api() 见 common.js。

    function onModeChanged() {
      const mode = document.getElementById("monitorMode").value;
      const hint = document.getElementById("modeHint");
      hint.textContent = mode === "coverage" ? "覆盖模式：系统将 Coverage 小时数均分给所有监控用户并加入随机抖动。" : "定时模式：每隔 Interval 小时对全量用户触发一次抓取。";
    }

    function renderStatus(status, users) {
      const userList = Array.isArray(users) ? users : [];
      const usersCount = userList.length;
      const mode = status.mode || "interval";
      const dot = document.getElementById("runStateDot");
      const text = document.getElementById("runStateText");

      if (status.is_running) {
        dot.classList.add("running"); text.textContent = "运行中";
        document.getElementById("btnStart").style.display = "none"; document.getElementById("btnStop").style.display = "inline-flex";
        document.getElementById("metric-health").textContent = "正在后台轮询";
        document.getElementById("metric-health").style.color = "var(--success)";
      } else {
        dot.classList.remove("running"); text.textContent = "已停止";
        document.getElementById("btnStart").style.display = "inline-flex"; document.getElementById("btnStop").style.display = "none";
        document.getElementById("metric-health").textContent = "服务已暂停";
        document.getElementById("metric-health").style.color = "var(--text-muted)";
      }

      document.getElementById("metric-mode-name").textContent = mode === "coverage" ? "Coverage" : "Interval";
      document.getElementById("metric-mode-desc").textContent = (mode === "coverage" ? `${Number(status.coverage_hours || 0)}h/覆盖` : `${Number(status.interval_hours || 0)}h/间隔`);

      document.getElementById("metric-users").textContent = String(usersCount);
      const cycleDownloads = Number((status.last_run_result || {}).downloaded_items || 0);
      document.getElementById("metric-downloads").textContent = String(cycleDownloads);
      const totalDownloaded = userList.reduce((sum, u) => sum + Number(u.downloaded_count || 0), 0);
      const hint = document.getElementById("metric-downloads-hint");
      if (hint) {
        hint.textContent = `累计下载作品 ${totalDownloaded}（本轮 ${cycleDownloads}）`;
      }

      const live = status.cookie_liveness || {};
      const cookieStatus = String(live.status || "").trim() || "未检测";
      const cookieEl = document.getElementById("metric-cookie-status");
      const cookieDetail = document.getElementById("metric-cookie-detail");
      if (cookieEl) {
        cookieEl.textContent = cookieStatus;
        const colorMap = {
          healthy: "var(--success)",
          degraded: "#b45309",
          expired: "var(--danger)",
          unknown: "var(--text-muted)",
        };
        cookieEl.style.color = colorMap[cookieStatus] || "var(--text-muted)";
      }
      if (cookieDetail) {
        const signal = live.signal ? `信号 ${live.signal}` : "无信号";
        const samples = live.samples_used != null ? `样本 ${live.samples_used}` : "";
        const fresh = live.fresh_count != null ? `fresh ${live.fresh_count}` : "";
        const reason = live.reason ? String(live.reason) : "";
        cookieDetail.textContent = [signal, samples, fresh].filter(Boolean).join(" · ") + (reason ? ` · ${reason}` : "");
      }

      if (status.mode) document.getElementById("monitorMode").value = status.mode;
      if (status.interval_hours != null) document.getElementById("intervalHours").value = String(status.interval_hours);
      if (status.coverage_hours != null) document.getElementById("coverageHours").value = String(status.coverage_hours);
      onModeChanged();
    }

    function getHistorySync(user) {
      return user && typeof user.history_sync === "object" && user.history_sync ? user.history_sync : {};
    }

    function formatHistorySync(historySync) {
      const status = String(historySync.status || "idle").trim();
      const labelMap = {
        pending: "待回填",
        running: "回填中",
        paused: "已暂停",
        completed: "已完成",
        failed: "部分失败",
        idle: "未启动",
      };
      const label = labelMap[status] || status || "未启动";
      const pages = Number(historySync.processed_pages || 0);
      const downloaded = Number(historySync.downloaded_items || 0);
      return `历史: ${label} · 页数 ${pages} · 已补 ${downloaded}`;
    }

    function isHistorySyncActive(historySync) {
      const status = String((historySync || {}).status || "").trim();
      return ["pending", "running", "failed"].includes(status);
    }

    function renderUsers(users) {
      cachedUsers = Array.isArray(users) ? users : [];
      const filteredUsers = filterUsers(cachedUsers);
      const root = document.getElementById("users");
      const toggleBtn = document.getElementById("toggleAllUsersBtn");
      const isSearching = Boolean(getUserSearchKeyword());
      const totalUsers = cachedUsers.length;
      const matchedUsers = filteredUsers.length;

      document.getElementById("userCountText").textContent = isSearching
        ? `(${matchedUsers}/${totalUsers})`
        : `(${totalUsers})`;

      if (!matchedUsers) {
        root.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-muted);">${buildUserEmptyState(totalUsers, matchedUsers)}</div>`;
        if (toggleBtn) toggleBtn.style.display = 'none';
        return;
      }

      const MAX_PREVIEW = 5;
      const needsToggle = !isSearching && matchedUsers > MAX_PREVIEW;

      if (toggleBtn) {
        if (needsToggle) {
          toggleBtn.style.display = 'inline-flex';
          toggleBtn.innerHTML = isGlobalUserListExpanded
            ? '收起列表'
            : `展开全部 ${matchedUsers} 个`;
        } else {
          toggleBtn.style.display = 'none';
        }
      }

      const displayUsers = (isSearching || isGlobalUserListExpanded || !needsToggle)
        ? filteredUsers
        : filteredUsers.slice(0, MAX_PREVIEW);

      root.innerHTML = displayUsers.map(user => {
        const paused = !user.enabled;
        const historySync = getHistorySync(user);
        const historyAction = (() => {
          if (String(historySync.status || "") === "paused") {
            return `<button class="btn btn-secondary btn-sm" onclick="resumeHistoryBackfill('${user.id}')" title="继续历史回填">继续回填</button>`;
          }
          if (isHistorySyncActive(historySync)) {
            return `<button class="btn btn-secondary btn-sm" onclick="pauseHistoryBackfill('${user.id}')" title="暂停历史回填">暂停回填</button>`;
          }
          const label = String(historySync.status || "") === "completed" ? "重扫历史" : "补历史";
          return `<button class="btn btn-secondary btn-sm" onclick="startHistoryBackfill('${user.id}')" title="启动历史回填">${label}</button>`;
        })();
        const displayName = escapeHtml(user.nickname || user.sec_user_id || "-");
        const subInfo = '';
        const avatarHtml = renderUserAvatar(user);
        const errorHtml = user.last_error ? `<div style="color: var(--danger); font-size: 12px; margin-top: 4px;">异常: ${escapeHtml(user.last_error)}</div>` : "";
        return `
          <div class="user-row">
            <div class="user-info">
              ${avatarHtml}
              <div class="user-details">
                <div class="user-name">
                  <div class="status-dot ${paused ? '' : 'running'}" style="background: ${paused ? 'var(--text-lighter)' : 'var(--success)'}; box-shadow: none;"></div>
                  ${displayName}
                  ${subInfo}
                </div>
                <div class="user-meta">
                  <span class="user-meta-item">已下载: <strong>${user.downloaded_count || 0}</strong></span>
                  <span class="user-meta-item">上次检查: ${formatTime(user.last_checked_at, '未检查')}</span>
                  
                  <span class="user-meta-item">${escapeHtml(formatHistorySync(historySync))}</span>
                </div>
                ${errorHtml}
              </div>
            </div>

            <div class="user-actions">
              <button class="btn btn-secondary btn-sm" onclick="runUserOnce('${user.id}')" title="单独检查">${Icons.bolt} 检查</button>
              ${historyAction}
              <button class="btn btn-secondary btn-sm" onclick="copyUserProfile('${jsAttr(user.profile_url || '')}', '${jsAttr(user.nickname || user.sec_user_id || '')}')" title="复制主页链接">${Icons.clipboard} 复制</button>
              <button class="btn btn-secondary btn-sm" onclick="toggleUser('${user.id}', ${paused})" title="${paused ? '启用' : '暂停'}">
                ${paused ? Icons.play + ' 启用' : Icons.pause + ' 暂停'}
              </button>
              <button class="btn btn-secondary btn-sm" style="color: var(--danger);" onclick="deleteUser('${user.id}')" title="删除">
                ${Icons.trash}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderGlobalRecords(users) {
      const allRecords = [];
      for (const user of users) {
        for (const record of (Array.isArray(user.download_records) ? user.download_records : [])) {
          allRecords.push({ ...record, user_nickname: (user.nickname || user.sec_user_id || "-") });
        }
      }
      allRecords.sort((a, b) => parseTimeToMillis(b.downloaded_at) - parseTimeToMillis(a.downloaded_at));
      
      const topRecords = allRecords.slice(0, 50);
      document.getElementById("recordsTotal").textContent = `${topRecords.length} 条`;

      const root = document.getElementById("globalRecords");
      if (!topRecords.length) { root.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">暂无下载记录</div>'; return; }

      root.innerHTML = topRecords.map(record => {
        const isVideo = record.media_type === "video";
        let metaText = isVideo ? "视频" : "图文";
        if (!isVideo && record.image_count) metaText += ` (${record.image_count}张)`;
        return `
          <div class="feed-item">
            <div class="feed-icon ${isVideo ? 'video' : 'photo'}">${isVideo ? Icons.video : Icons.photo}</div>
            <div class="feed-content">
              <div class="feed-header"><span class="feed-user">${record.user_nickname}</span><span class="feed-time">${formatTime(record.downloaded_at)}</span></div>
              <div class="feed-desc">[${metaText}] 新增 ${Number(record.downloaded_file_count || 0)} 个文件</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function refreshAll() {
      const seq = ++refreshSeq;
      try {
        const [status, usersResp] = await Promise.all([api("/status"), api("/users")]);
        // 丢弃过期请求，避免快速连续刷新时旧数据回写覆盖当前视图
        if (seq !== refreshSeq) return;
        renderStatus(status, usersResp.users || []);
        renderGlobalRecords(usersResp.users || []);
        renderUsers(usersResp.users || []);
      } catch (err) {
        if (seq !== refreshSeq) return;
        showToast(err.message, 'error');
      }
    }

    async function toggleUser(userId, enabled) {
      try { await api(`/users/${userId}`, { method: "PATCH", body: JSON.stringify({ enabled }) }); showToast(enabled ? "已启用" : "已暂停"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteUser(userId) {
      if (!confirm("确定要删除该用户的监控任务及相关数据吗？")) return;
      try { await api(`/users/${userId}`, { method: "DELETE" }); showToast("用户已删除"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function runUserOnce(userId) {
      try { showToast("已下发检查任务..."); const res = await api(`/users/${userId}/run_once`, { method: "POST" }); showToast(`下载了 ${res.downloaded_items || 0} 个作品`); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function startHistoryBackfill(userId) {
      try { await api(`/users/${userId}/backfill/start`, { method: "POST" }); showToast("已启动历史回填"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function pauseHistoryBackfill(userId) {
      try { await api(`/users/${userId}/backfill/pause`, { method: "POST" }); showToast("已暂停历史回填"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function resumeHistoryBackfill(userId) {
      try { await api(`/users/${userId}/backfill/resume`, { method: "POST" }); showToast("已恢复历史回填"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function runHistoryBackfillOnce(userId) {
      try { const res = await api(`/users/${userId}/backfill/run_once`, { method: "POST" }); showToast(`历史回填新增 ${res.downloaded_items || 0} 个作品`); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    // copyUserProfile() 见 common.js。

    async function startMonitor() {
      try {
        const body = { mode: document.getElementById("monitorMode").value, interval_hours: Number(document.getElementById("intervalHours").value || "0.05"), coverage_hours: Number(document.getElementById("coverageHours").value || "24") };
        await api("/start", { method: "POST", body: JSON.stringify(body) });
        showToast("调度已更新 / 已启动"); await refreshAll();
      } catch (err) { showToast(err.message, 'error'); }
    }
    const applySettings = startMonitor;

    async function stopMonitor() {
      try { await api("/stop", { method: "POST" }); showToast("已停止"); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    async function runOnce() {
      try { showToast("开始全局检查..."); const res = await api("/run_once", { method: "POST" }); showToast(`检查 ${res.checked_users || 0} 人, 下载 ${res.downloaded_items || 0} 个作品`); await refreshAll(); } catch (err) { showToast(err.message, 'error'); }
    }

    onModeChanged();
    refreshAll();
    setInterval(refreshAll, 15000);
  </script>

</body>
</html>
