<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>调度配置 | Monitor</title>
  <link rel="stylesheet" href="/static/common.css?v={ver}" />
  <style>
    .settings-grid {{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 720px; }}
    .settings-card {{ background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }}
    .settings-card .card-header {{ background: var(--bg-elevated, #f8fafc); border-bottom: 1px solid var(--border-color); padding: 16px 18px; }}
    .settings-card .card-body {{ padding: 18px; }}
    .status-line {{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }}
    .mode-pill {{ display: inline-flex; align-items: center; gap: 6px; background: var(--primary-light); color: var(--accent); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand" aria-hidden="true">抖</div>
      <span id="sidebarTitle">用户监控台</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/api/monitor/dashboard" onclick="return navigateToPage('/api/monitor/dashboard')" title="数据大盘">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
        数据大盘
      </a>
      <a class="nav-item" href="/api/monitor/statistics/dashboard" onclick="return navigateToPage('/api/monitor/statistics/dashboard')" title="用户统计">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75h9A2.25 2.25 0 0 1 18.75 6v12A2.25 2.25 0 0 1 16.5 20.25h-9A2.25 2.25 0 0 1 5.25 18V6A2.25 2.25 0 0 1 7.5 3.75Zm1.5 4.5h6m-6 3h6m-6 3h3" /></svg>
        用户统计
      </a>
      <a class="nav-item" href="/api/monitor/cookies/dashboard" onclick="return navigateToPage('/api/monitor/cookies/dashboard')" title="Cookie 池">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" /></svg>
        Cookie 池
      </a>
      <div class="nav-spacer"></div>
      <a class="nav-item active" href="/api/monitor/settings/dashboard" onclick="return navigateToPage('/api/monitor/settings/dashboard')" title="调度配置">
        {nav_settings_svg}
        调度配置
      </a>
      <a class="nav-item" onclick="refreshStatus()" title="刷新状态">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
        刷新状态
      </a>
    </nav>
  </aside>

  <div class="app-wrapper">
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-secondary btn-sm mobile-sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
        <div class="title-with-orb">
          <div class="title-orb">◉</div>
          <div>
            <div style="font-size:15px;font-weight:750;">配置</div>
            <div style="font-size:11px;color:var(--text-muted);">调度与系统</div>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <div id="runStateDot" class="status-dot"></div>
          <span id="runStateText">加载中...</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="content-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">调度与系统配置</h1>
            <p class="page-subtitle">独立配置页 · 保存后立即应用 · <span class="ui-build-chip">UI {ver}</span></p>
          </div>
          <div class="page-actions">
            <a class="btn btn-secondary" href="/api/monitor/dashboard" onclick="return navigateToPage('/api/monitor/dashboard')">返回大盘</a>
            <button class="btn btn-secondary" onclick="refreshStatus()">刷新状态</button>
          </div>
        </div>

        <div class="settings-grid">
          <div class="settings-card">
            <div class="card-header">
              <div>
                <div class="card-title">当前运行状态</div>
                <div class="card-subtitle">读取 /status，保存后立即应用调度</div>
              </div>
              <span class="mode-pill" id="currentModePill">-</span>
            </div>
            <div class="card-body">
              <div class="status-line">
                <span class="help-text">运行：</span><strong id="statusRunning">-</strong>
                <span class="help-text">模式：</span><strong id="statusMode">-</strong>
                <span class="help-text">间隔：</span><strong id="statusInterval">-</strong>
                <span class="help-text">覆盖：</span><strong id="statusCoverage">-</strong>
              </div>
            </div>
          </div>

          <div class="settings-card">
            <div class="card-header">
              <div>
                <div class="card-title">任务调度策略</div>
                <div class="card-subtitle">Interval 定时轮询 / Coverage 覆盖轮询</div>
              </div>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">监控模式</label>
                <select id="monitorMode" class="input" onchange="onModeChanged()">
                  <option value="interval">定时轮询 (Interval)</option>
                  <option value="coverage">覆盖轮询 (Coverage)</option>
                </select>
              </div>
              <div class="form-row">
                <div class="form-group flex-1">
                  <label class="form-label">间隔小时 (Interval)</label>
                  <input id="intervalHours" type="number" class="input" min="0.01" step="0.01" value="0.05" />
                </div>
                <div class="form-group flex-1">
                  <label class="form-label">覆盖小时 (Coverage)</label>
                  <input id="coverageHours" type="number" class="input" min="0.1" step="0.1" value="24" />
                </div>
              </div>
              <p class="help-text" id="modeHint"></p>
              <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
                <button class="btn btn-primary" onclick="applySettings()">保存配置并应用</button>
                <button class="btn btn-secondary" onclick="stopMonitor()">停止后台监控</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <nav class="bottom-tabbar" aria-label="Mobile tabs">
    <a class="bottom-tab" href="/api/monitor/dashboard" onclick="return navigateToPage('/api/monitor/dashboard')">
      <span class="tab-ico"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg></span>
      监控
    </a>
    <a class="bottom-tab" href="/api/monitor/statistics/dashboard" onclick="return navigateToPage('/api/monitor/statistics/dashboard')">
      <span class="tab-ico"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19V5m5 14V9m5 10V7m5 12V11"/></svg></span>
      统计
    </a>
    <a class="bottom-tab" href="/api/monitor/cookies/dashboard" onclick="return navigateToPage('/api/monitor/cookies/dashboard')">
      <span class="tab-ico"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 1 1-7.03 5.91c-.56-.1-1.16.03-1.56.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.82c0-.6.24-1.17.66-1.59l6.5-6.5c.4-.4.53-1 .43-1.56A6 6 0 0 1 21.75 8.25Z"/></svg></span>
      Cookie
    </a>
    <a class="bottom-tab active" href="/api/monitor/settings/dashboard" onclick="return navigateToPage('/api/monitor/settings/dashboard')">
      {nav_settings_svg}
      配置
    </a>
  </nav>

  <div id="sidebarOverlay" class="overlay" onclick="toggleSidebar()"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/common.js?v={ver}"></script>
  <script>
    const Icons = {{ checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`, exclamation: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" /></svg>` }};

    function isMobileViewport() {{ return window.matchMedia("(max-width: 1024px)").matches; }}

    function showToast(message, type = 'success') {{
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${{type}}`;
      toast.innerHTML = `<div style="color: ${{type==='success'?'var(--success)':'var(--danger)'}}">${{type === 'success' ? Icons.checkCircle : Icons.exclamation}}</div><div style="font-size:14px; font-weight:500;">${{message}}</div>`;
      container.appendChild(toast);
      requestAnimationFrame(() => {{ requestAnimationFrame(() => {{ toast.classList.add('show'); }}); }});
      setTimeout(() => {{ toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }}, 3000);
    }}

    function onModeChanged() {{
      const mode = document.getElementById("monitorMode").value;
      const hint = document.getElementById("modeHint");
      hint.textContent = mode === "coverage" ? "覆盖模式：系统将 Coverage 小时数均分给所有监控用户并加入随机抖动。" : "定时模式：每隔 Interval 小时对全量用户触发一次抓取。";
    }}

    function renderStatus(status) {{
      const running = !!(status && (status.running || status.is_running));
      const mode = status?.mode || "-";
      const interval = status?.interval_hours != null ? status.interval_hours : "-";
      const coverage = status?.coverage_hours != null ? status.coverage_hours : "-";
      document.getElementById("runStateText").textContent = running ? "运行中" : "已停止";
      document.getElementById("runStateDot").style.background = running ? "var(--success)" : "var(--text-lighter)";
      document.getElementById("statusRunning").textContent = running ? "运行中" : "已停止";
      document.getElementById("statusMode").textContent = mode;
      document.getElementById("statusInterval").textContent = interval;
      document.getElementById("statusCoverage").textContent = coverage;
      document.getElementById("currentModePill").textContent = mode === "coverage" ? "Coverage" : (mode === "interval" ? "Interval" : mode);
      if (status?.mode) document.getElementById("monitorMode").value = status.mode;
      if (status?.interval_hours != null) document.getElementById("intervalHours").value = String(status.interval_hours);
      if (status?.coverage_hours != null) document.getElementById("coverageHours").value = String(status.coverage_hours);
      onModeChanged();
    }}

    async function refreshStatus() {{
      try {{
        const status = await api("/status");
        renderStatus(status || {{}});
      }} catch (err) {{
        showToast(err.message, "error");
      }}
    }}

    async function applySettings() {{
      try {{
        const body = {{ mode: document.getElementById("monitorMode").value, interval_hours: Number(document.getElementById("intervalHours").value || "0.05"), coverage_hours: Number(document.getElementById("coverageHours").value || "24") }};
        await api("/start", {{ method: "POST", body: JSON.stringify(body) }});
        showToast("调度已更新 / 已启动");
        await refreshStatus();
      }} catch (err) {{
        showToast(err.message, "error");
      }}
    }}

    async function stopMonitor() {{
      try {{
        await api("/stop", {{ method: "POST" }});
        showToast("已停止");
        await refreshStatus();
      }} catch (err) {{
        showToast(err.message, "error");
      }}
    }}

    onModeChanged();
    refreshStatus();
    setInterval(refreshStatus, 15000);
  </script>
</body>
</html>
