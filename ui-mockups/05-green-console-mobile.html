<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>E mobile</title>
<style>
:root{--bg:#0b1410;--panel:rgba(22,36,29,.92);--line:rgba(125,186,138,.12);--line-strong:rgba(125,186,138,.22);--text:#e7f3ea;--muted:#7f9a88;--faint:#5d7566;--green:#86c995;--green-soft:rgba(134,201,149,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px;background:#050a08;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:var(--text)}
.phone{width:390px;background:linear-gradient(180deg,#101a15,#0b1410);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.p-status{height:36px;display:flex;justify-content:space-between;align-items:center;padding:10px 18px 0;font-size:12px;color:var(--muted);font-weight:600}
.p-head{padding:8px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.p-head h3{font-size:18px;font-weight:700}
.p-head span{font-size:11px;color:var(--green);background:var(--green-soft);border:1px solid var(--line-strong);border-radius:999px;padding:5px 9px;font-weight:700}
.p-body{padding:0 14px 16px}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.p-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.p-stat .l{font-size:11px;color:var(--muted)}.p-stat .v{font-size:20px;font-weight:800;margin-top:4px}
.p-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.p-card h4{font-size:13px;margin-bottom:10px}
.p-input{background:rgba(8,14,11,.7);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--faint);font-size:13px;margin-bottom:8px}
.p-btn{background:linear-gradient(180deg,#93d3a2,#6bb57c);color:#0b1410;text-align:center;border-radius:12px;padding:11px;font-weight:800;font-size:13px}
.p-user{display:flex;gap:10px;align-items:center}
.p-av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#86c995,#3f7a52);display:grid;place-items:center;font-weight:800;color:#0b1410}
.p-meta b{display:block;font-size:14px}.p-meta span{font-size:11px;color:var(--muted)}
.p-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.p-mini div{text-align:center;background:rgba(8,14,11,.45);border-radius:10px;padding:8px 2px;border:1px solid var(--line)}
.p-mini b{display:block;font-size:12px}.p-mini span{font-size:10px;color:var(--faint)}
.p-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.p-acts div{text-align:center;font-size:12px;font-weight:700;padding:9px 0;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.p-acts .x{color:#ef9a9a;border-color:rgba(239,123,123,.3)}
.p-tab{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:10px 6px 14px}
.p-tab div{text-align:center;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px}
.p-tab .on{color:var(--green);font-weight:700}
.dot{width:18px;height:18px;border-radius:6px;background:currentColor;opacity:.25}
.p-tab .on .dot{opacity:1;background:var(--green)}
.label{position:absolute;top:12px;right:18px;background:#86c995;color:#0b1410;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px}
.wrap{position:relative}
</style></head><body><div class="wrap">
<div class="phone">
<div class="p-status"><span>9:41</span><span>5G ■■■</span></div>
<div class="p-head"><h3>主页</h3><span>● 运行中</span></div>
<div class="p-body">
<div class="p-stats">
<div class="p-stat"><div class="l">监控用户</div><div class="v">1</div></div>
<div class="p-stat"><div class="l">新增作品</div><div class="v">0</div></div>
<div class="p-stat"><div class="l">运行天数</div><div class="v">0</div></div>
</div>
<div class="p-card"><h4>添加用户</h4><div class="p-input">抖音号 / 主页链接</div><div class="p-btn">开始监控</div></div>
<div class="p-card"><h4>监控用户</h4>
<div class="p-user"><div class="p-av">李</div><div class="p-meta"><b>李佳琦Austin</b><span>947172008 · 刚刚同步</span></div></div>
<div class="p-mini"><div><b>1</b><span>作品</span></div><div><b>0</b><span>新增</span></div><div><b>0</b><span>失败</span></div><div><b>OK</b><span>状态</span></div></div>
<div class="p-acts"><div>同步</div><div>详情</div><div class="x">移除</div></div>
</div>
</div>
<div class="p-tab"><div class="on"><div class="dot"></div>主页</div><div><div class="dot"></div>监控</div><div><div class="dot"></div>用户</div><div><div class="dot"></div>设置</div></div>
</div></div></body></html>
